<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070b14">
<title>Extinction Event</title>
<link rel="apple-touch-icon" href="apple-touch-icon-2.PNG">
<style>
:root{
  --bg:#060914;--glass:rgba(10,17,33,.82);--glass2:rgba(20,32,56,.9);--panel3:#1d2e4c;--line:rgba(110,150,210,.22);
  --text:#e8f1ff;--muted:#8a9cc0;--blue:#39c8ff;--red:#ff4d4d;
  --credit:#ffd34d;--energy:#5dffb0;--pop:#c49bff;--bad:#ff5a6e;--good:#5dff8a;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* The battlefield is a night-side world, so both themes share the dark palette. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060914;--text:#e8f1ff;--muted:#8a9cc0}}
:root[data-theme="dark"]{--bg:#060914;--text:#e8f1ff;--muted:#8a9cc0}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.25 -apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* The battlefield fills the whole screen, including the strip behind the viewer's top bar */
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:0}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;pointer-events:none;padding:0 calc(env(safe-area-inset-right,0px) + 6px) 0 calc(env(safe-area-inset-left,0px) + 6px)}
#hud,#panel,#bp{pointer-events:auto}
/* The top bar sits just below the viewer's own strip: that strip swallows taps, so nothing interactive goes there */
#hud{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 3px);
  left:calc(env(safe-area-inset-left,0px) + 6px);
  right:calc(env(safe-area-inset-right,0px) + 6px);
  height:40px;display:flex;align-items:center;gap:10px;padding:0 5px 0 10px;background:var(--glass);border:1px solid var(--line);border-radius:13px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.res{display:flex;align-items:center;gap:5px;min-width:0;white-space:nowrap}
.res>div{display:flex;flex-direction:column;line-height:1.05}
.res b{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.res small{color:var(--muted);font-size:9.5px;font-variant-numeric:tabular-nums}
#mm{flex:1 1 auto;min-width:60px;height:28px;border-radius:8px;display:block;touch-action:none;cursor:pointer}
.res.full b{color:var(--bad)}
/* HQ readouts either side of the overview map: blue is yours (left end of the map), red the enemy's */
.hqr{display:flex;align-items:center;gap:4px;flex:0 0 auto;--tc:var(--blue)}
#hq1{--tc:var(--red)}
.hqr>div{display:flex;flex-direction:column;gap:3px;line-height:1}
.hqr .hb{display:block;width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.hqr .hb i{display:block;height:100%;width:100%;background:var(--good)}
.hqr small{font-size:9.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.hqr .shd{width:12px;height:14px;flex:0 0 auto;overflow:visible}
.hqr .shd path{fill:var(--tc);stroke:var(--tc);stroke-width:1.3;stroke-linejoin:round}
.hqr .shd .x{display:none;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round}
.hqr.exposed .shd path{fill:transparent;stroke:var(--bad)}
.hqr.exposed small{color:var(--bad)}
.hqr.destroyed{opacity:.8}
.hqr.destroyed .shd path{fill:#5a1c22;stroke:var(--bad)}
.hqr.destroyed .shd .x{display:inline}
.hqr.destroyed small{color:var(--bad);font-weight:800}
.hqr.stale{opacity:.55}
.hqr.stale small{color:var(--muted)}
#cd{position:absolute;inset:0;padding-top:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;text-shadow:0 2px 16px rgba(0,0,0,.75);z-index:3}
#cd.hide{display:none}
#cd small{font-size:15px;font-weight:900;letter-spacing:.3em;color:var(--blue)}
#cd b{font-size:64px;line-height:1.05;font-weight:900;color:var(--text);min-height:1em}
#cd.go b{color:var(--good)}
#cd b.pop{animation:cdpop .45s ease-out}
@keyframes cdpop{from{transform:scale(1.7);opacity:0}}
.ico{display:inline-block;width:14px;height:14px;flex:0 0 auto}
.ico.c{background:var(--credit);transform:rotate(45deg) scale(.74);border-radius:2px;box-shadow:0 0 8px rgba(255,211,77,.55)}
.ico.e{background:var(--energy);clip-path:polygon(58% 0,8% 58%,44% 58%,34% 100%,92% 40%,56% 40%)}
.ico.p{background:radial-gradient(circle at 50% 27%,var(--pop) 0 23%,transparent 25%),radial-gradient(ellipse 48% 44% at 50% 100%,var(--pop) 0 98%,transparent 100%)}
.spacer{flex:1}
.seg{display:flex;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;height:32px;padding:0 9px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--panel3);color:var(--text);box-shadow:inset 0 0 0 1px rgba(57,200,255,.55)}
#stance button.on[data-s="attack"]{background:#3a1616;box-shadow:inset 0 0 0 1px rgba(255,77,77,.75);color:#ffd6d6}
#stance button.on[data-s="retreat"]{background:#3a3014;box-shadow:inset 0 0 0 1px rgba(255,211,77,.7);color:#ffeab0}
.hbtn{height:34px;min-width:40px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
#field{flex:1 1 auto;position:relative;min-height:0}
#toasts{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 50px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;width:min(70%,calc(100vw - 2 * (env(safe-area-inset-right,0px) + 70px)))}
.t{background:rgba(8,14,26,.9);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600;animation:tin .18s ease-out;transition:opacity .3s;white-space:nowrap}
.t.bad{border-color:rgba(255,90,110,.75);color:#ffc7cf}
.t.ok{border-color:rgba(93,255,138,.55)}
.t.warn{border-color:rgba(255,211,77,.75);color:#ffeab0}
.t.out{opacity:0}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}
#bp{position:absolute;right:58px;bottom:6px;width:264px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:8px 9px 9px 11px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#bp.hide{display:none}
.bph{display:flex;align-items:center;gap:7px}
.bph b{font-size:13.5px}
.pips{display:flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--credit)}
.pips i.on{background:var(--credit)}
#bpX{margin-left:auto;width:30px;height:26px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.25);font-size:15px;line-height:1}
#bpNow{color:var(--muted);margin-top:3px}
#bpNext{margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
#bpNext .no{color:var(--bad)}
.bpr{display:flex;gap:6px;margin-top:7px}
.bpr button{flex:1;height:34px;border-radius:9px;font-weight:800;font-size:12.5px}
#bpUp{border:0;background:linear-gradient(#4fd3ff,#1b8fd0);color:#001522}
#bpUp.poor,#bpUp[disabled]{background:var(--panel3);color:var(--muted)}
#bpSell{border:1px solid rgba(255,90,110,.45);background:rgba(255,77,77,.08);color:#ffc7cf}
#bpSell.arm{background:#5a1c22;border-color:var(--bad);color:#fff}
#bpSell.hide,#bpUp.hide,#bpRep.hide{display:none}
#bpRep{border:1px solid rgba(93,255,138,.45);background:rgba(93,255,138,.08);color:#c8ffd9}
#bpRep[disabled]{opacity:.6}
#bpHp{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
#info{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);width:min(420px,calc(100vw - 2 * (env(safe-area-inset-right,0px) + 70px)));background:rgba(10,17,33,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:9px 12px 10px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#info.hide{display:none}
.info-open #bp{visibility:hidden} /* the building panel waits behind the info panel instead of overlapping it */
/* Commander abilities: a column on the right edge of the battlefield, clear of the top bar, the cards and both panels */
#abil{position:fixed;z-index:2;right:calc(env(safe-area-inset-right,0px) + 6px);top:calc(env(safe-area-inset-top,0px) + 50px);display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#abil.hide,#aim.hide{display:none}
.ab{position:relative;width:50px;height:50px;border-radius:50%;border:2px solid rgba(120,150,200,.45);background:rgba(14,22,40,.86);padding:0;overflow:hidden;-webkit-touch-callout:none;user-select:none}
.ab svg{position:relative;width:22px;height:22px;display:block;margin:5px auto 0;pointer-events:none}
.ab small{position:relative;display:block;font-size:9.5px;line-height:11px;font-weight:700;color:#d6e4ff;font-variant-numeric:tabular-nums;pointer-events:none;white-space:nowrap}
.ab small .e{color:#7dffb0} .ab small .no{color:var(--bad)}
.ab .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.62) calc(var(--p,0) * 1turn),transparent 0);pointer-events:none}
.ab.ready{border-color:var(--ac)} .ab.cool svg,.ab.poor svg,.ab.lock svg,.ab.wait svg{opacity:.4}
.ab.on{border-color:#fff;box-shadow:0 0 0 3px var(--ac)}
.ab.shake{animation:shake .3s}
#aim{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);display:flex;align-items:center;gap:0;padding:6px 6px 6px 12px;border-radius:12px;background:rgba(12,18,34,.92);border:1px solid var(--ac);color:#e6eefc;font-size:13px;white-space:nowrap;pointer-events:auto}
#aim b{color:#fff} #aimX{margin-left:10px;height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.1);font-weight:700}
@media (max-height:380px){#abil{gap:5px}.ab{width:46px;height:46px}.ab svg{width:20px;height:20px;margin-top:4px}}
#info .ih{display:flex;align-items:center;gap:8px}
#info .ih b{font-size:14.5px}
#info .ih small{color:var(--muted)}
#infoX{margin-left:auto;width:30px;height:26px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.25);font-size:15px;line-height:1}
.istats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px 10px;margin-top:6px}
.istats div{display:flex;flex-direction:column}
.istats small{color:var(--muted);font-size:10.5px}
.istats b{font-size:13px;font-variant-numeric:tabular-nums}
.irow{margin-top:5px;line-height:1.3}
.irow em{font-style:normal;color:var(--muted)}
#panel{flex:0 0 auto;height:78px;margin-bottom:3px;display:flex;background:var(--glass);border:1px solid var(--line);border-radius:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow:hidden}
.tabs{display:flex;flex-direction:column;gap:4px;padding:5px 0 5px 5px;width:72px;flex:0 0 auto}
.tabs button{flex:1;border:1px solid var(--line);background:rgba(0,0,0,.25);border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--panel3);color:var(--text);border-color:rgba(57,200,255,.6)}
#cards{flex:1;display:flex;gap:5px;padding:5px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x}
#cards::-webkit-scrollbar{display:none}
.card{position:relative;flex:0 0 92px;height:100%;border-radius:10px;border:1px solid var(--line);background:linear-gradient(rgba(30,46,76,.9),rgba(15,24,43,.9));display:flex;flex-direction:column;align-items:center;padding:2px 4px 6px;overflow:hidden;transition:transform .08s}
.card:active{transform:scale(.94)}
.card .ic{width:56px;height:32px;display:block;pointer-events:none}
.card .nm{font-size:11.5px;font-weight:700;white-space:nowrap;pointer-events:none}
.card .cost{font-size:10.5px;display:flex;gap:6px;align-items:center;margin-top:1px;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none}
.cost .no{color:var(--bad)}
.card .cost .lock{color:var(--muted);white-space:normal;text-align:center;line-height:1.1;font-size:10px}
.card .badge{position:absolute;top:3px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--blue);color:#001522;font-size:10.5px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 5px}
.card .badge.show{display:flex}
.card .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06)}
.card .bar i{display:block;height:100%;width:0;background:var(--blue)}
.card.locked{opacity:.5}
.card.poor .nm{color:var(--muted)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.dot{display:inline-block;width:7px;height:7px;margin-right:3px}
.dot.c{background:var(--credit);transform:rotate(45deg) scale(.85)}
.dot.e{background:var(--energy);border-radius:50%}
.dot.p{background:var(--pop);border-radius:50%}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,6,14,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:10;padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 16px)}
#ov.hide{display:none}
.box{position:relative;width:min(620px,100%);max-height:100%;overflow:auto;background:linear-gradient(#111c33,#0a1222);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.box h1{margin:0;font-size:28px;line-height:1.05;font-weight:900;letter-spacing:.02em;color:var(--text)}
.box h1 span{color:var(--blue)}
.box h1.win{color:var(--good)}
.box h1.lose{color:var(--bad)}
.box .kicker{margin:0 0 4px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.box .ver{position:absolute;top:10px;right:14px;margin:0;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.box p{margin:6px 0 0;color:var(--muted);font-size:13.5px;max-width:64ch}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.how div{background:rgba(30,46,76,.6);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--muted)}
.how b{display:block;color:var(--text);font-size:13px;margin-bottom:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.row .lbl{color:var(--muted);font-size:13px}
.big{height:48px;padding:0 26px;border-radius:12px;border:0;background:linear-gradient(#4fd3ff,#1b8fd0);color:#001522;font-weight:800;font-size:16px}
.ghost{height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:rgba(30,46,76,.6);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stats div{background:rgba(30,46,76,.6);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:11.5px}
#rotate{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);text-align:center;padding:24px}
#rotate .ph{width:40px;height:66px;border:3px solid var(--blue);border-radius:9px;animation:rot 2.2s ease-in-out infinite}
#rotate small{color:var(--muted);font-size:13px;max-width:30ch}
@keyframes rot{45%,80%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}
@media (max-height:360px){#hud{height:38px}#panel{height:78px}.card{flex-basis:86px}.card .ic{height:28px}.how{display:none}}
@media (max-width:640px){.res small{display:none}#hud{gap:7px}.seg button{padding:0 7px}}
/* Narrower screens drop the status word (the shield icon still shows it); narrow phones also use the compact top bar */
@media (max-width:900px){.hqr small{display:none}.hqr .hb{width:28px}}
@media (max-width:820px){.res small{display:none}#hud{gap:7px}.seg button{padding:0 7px}.hqr{flex-direction:column;gap:3px}.hqr small{display:none}.hqr .hb{width:16px;height:3px}}
@media (max-width:700px){#hud{gap:5px}.hqr{margin:0 -2px}#mm{min-width:52px}}
@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none}.shake{animation:none}#cd b.pop{animation:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="app">
  <header id="hud">
    <div class="res" id="resC"><i class="ico c"></i><div><b id="vC">0</b><small id="rC"></small></div></div>
    <div class="res" id="resE"><i class="ico e"></i><div><b id="vE">0</b><small id="rE"></small></div></div>
    <div class="res" id="resP"><i class="ico p"></i><div><b id="vP">0/0</b><small>army</small></div></div>
    <div class="hqr" id="hq0" role="img" aria-label="Your HQ"><svg class="shd" viewBox="0 0 12 14" aria-hidden="true"><path d="M6 1l5 2v4c0 3-2.2 5-5 6C3.2 12 1 10 1 7V3z"/><path class="x" d="M3.6 4.6l4.8 4.8M8.4 4.6L3.6 9.4"/></svg><div><span class="hb"><i></i></span><small></small></div></div>
    <canvas id="mm" aria-label="Battlefield overview: tap to jump"></canvas>
    <div class="hqr" id="hq1" role="img" aria-label="Enemy HQ"><svg class="shd" viewBox="0 0 12 14" aria-hidden="true"><path d="M6 1l5 2v4c0 3-2.2 5-5 6C3.2 12 1 10 1 7V3z"/><path class="x" d="M3.6 4.6l4.8 4.8M8.4 4.6L3.6 9.4"/></svg><div><span class="hb"><i></i></span><small></small></div></div>
    <div class="seg" id="stance"><button data-s="hold" class="on">Hold</button><button data-s="attack">Attack</button><button data-s="retreat">Retreat</button></div>
    <button class="hbtn" id="bSpeed" aria-label="Game speed">1×</button>
    <button class="hbtn" id="bPause" aria-label="Pause"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="8.5" y="1" width="3.5" height="12" rx="1" fill="currentColor"/></svg></button>
  </header>
  <main id="field">
    <div id="toasts"></div>
    <div id="cd" class="hide" aria-live="assertive"><small></small><b></b></div>
    <div id="bp" class="hide">
      <div class="bph"><b id="bpName"></b><span class="pips" id="bpPips"></span><span id="bpHp"></span><button id="bpX" aria-label="Close">×</button></div>
      <div id="bpNow"></div>
      <div id="bpNext"></div>
      <div class="bpr"><button id="bpUp">Upgrade</button><button id="bpRep">Repair</button><button id="bpSell">Sell</button></div>
    </div>
    <div id="abil" class="hide" aria-label="Commander abilities"></div>
    <div id="aim" class="hide" role="status"><b id="aimName"></b><span id="aimTxt"></span><button id="aimX">Cancel</button></div>
    <div id="info" class="hide"><div class="ih"><b id="infoName"></b><small id="infoSub"></small><button id="infoX" aria-label="Close">×</button></div><div id="infoBody"></div></div>
  </main>
  <footer id="panel">
    <div class="tabs"><button data-tab="build" class="on">Build</button><button data-tab="army">Army</button></div>
    <div id="cards"></div>
  </footer>
</div>

function newGame(diffKey, opts = {}) {
  const g = { t: 0, ents: [], projs: [], fx: [], parts: [], sides: [], abil: [], over: false, winner: -1, nid: 1,
    diff: DIFF[diffKey] || DIFF.normal, diffKey, events: [], auto: !!opts.autoPlayer, autoDiff: opts.autoDiff || 'normal', shake: 0, front: [null, null], countdown: opts.countdown || 0,
    nodes: NODE_U.map((u, i) => ({ id: i, u, v: 0, prog: 0, owner: null, c: [0, 0] })) };
  for (let s = 0; s < 2; s++) {
    g.sides.push({ res: { c: 300, e: 60 }, stance: s === 0 ? 'hold' : 'retreat', stanceAt: 0, pushTo: null, slots: new Array(SLOT_COUNT).fill(null),
      hq: null, aiT: 1 + s * 0.5, stats: { built: 0, kills: 0, lost: 0 }, lastAlert: -99, buff: false, ab: newAb(0) });
    const hq = mkBuilding(g, s, 'hq', -1);
    hq.built = true; hq.progress = 1; hq.hp = hq.maxHp;
    g.sides[s].hq = hq;
  }
  g.sides[1].persona = rollPersona(opts.persona); // secret: never shown until the match is over
  if (g.auto) g.sides[0].persona = rollPersona(opts.autoPersona);
  g.fog = [newFog(g, 0), newFog(g, 1)];
  updateVision(g);
  return g;
}

function mkBuilding(g, s, type, slot) {
  const d = BDEF[type], pos = slot < 0 ? hqPos(s) : slotPos(s, slot);
  const b = { id: g.nid++, kind: 'b', type, side: s, slot, u: pos.u, v: pos.v, half: d.half, h: d.h * BS, tier: 1,
    hp: d.hp * 0.15, maxHp: d.hp, built: false, progress: 0, upgrading: false, upProg: 0, queue: [], prodT: 0,
    cd: 0, aim: null, hitT: 0, anim: Math.random() * 10, spent: { c: 0, e: 0 } };
  g.ents.push(b);
  if (slot >= 0) g.sides[s].slots[slot] = b;
  return b;
}

const WAIT_GO = { ok: false, msg: 'Wait for GO' }; // nothing can be queued or paid for during GET READY
function ev(g, o) { g.events.push(o); if (g.events.length > 60) g.events.shift(); }
const alive = (g, s, type) => g.ents.filter(e => e.kind === 'b' && e.side === s && e.type === type && e.hp > 0);
const hasBuilt = (g, s, type) => g.ents.some(e => e.kind === 'b' && e.side === s && e.type === type && e.built && e.hp > 0);
const hasTier = (g, s, type, t) => g.ents.some(e => e.kind === 'b' && e.side === s && e.type === type && e.built && e.hp > 0 && e.tier >= t);
const countB = (g, s, type) => alive(g, s, type).length;

function popCap(g, s) {
  let c = 0;
  for (const e of g.ents) if (e.kind === 'b' && e.side === s && e.built && e.hp > 0 && BDEF[e.type].pop) c += BDEF[e.type].pop[e.tier];
  return Math.min(POP_MAX, c);
}
function popUsed(g, s) {
  let p = 0;
  for (const e of g.ents) {
    if (e.side !== s || e.hp <= 0) continue;
    if (e.kind === 'u') p += UDEF[e.type].pop;
    else for (const q of e.queue) p += UDEF[q].pop;
  }
  return p;
}
function income(g, s) {
  let c = 0, e = 0;
  for (const b of g.ents) {
    if (b.kind !== 'b' || b.side !== s || !b.built || b.hp <= 0 || !BDEF[b.type].inc) continue;
    const inc = BDEF[b.type].inc[b.tier]; c += inc.c; e += inc.e;
  }
  for (const n of g.nodes) if (n.owner === s) { c += NODE_INC.c; e += NODE_INC.e; }
  return { c, e };
}
// Army strength for AI decisions; Interceptors count for a quarter, since they can't fight ground units or buildings
function armyValue(list) { let v = 0; for (const u of list) { const d = UDEF[u.type]; v += (d.cost.c + d.cost.e * 1.5) * (u.w === undefined ? 1 : u.w) * (d.hitsGround === false ? 0.25 : 1); } return v; }
const unitLockMsg = d => !d ? '' : (d.tier > 1 ? `Requires ${BDEF[d.from].name} T${d.tier}` : `Requires ${BDEF[d.from].name}`);

function tryBuild(g, s, type, want = -1) {
  const d = BDEF[type], side = g.sides[s];
  if (g.over) return { ok: false, msg: 'The match is over' };
  if (g.countdown > 0) return WAIT_GO;
  if (d.req && !hasBuilt(g, s, d.req)) return { ok: false, msg: `Requires a finished ${BDEF[d.req].name}` };
  const slot = want >= 0 && !side.slots[want] ? want : side.slots.findIndex(x => !x);
  if (slot < 0) return { ok: false, msg: 'All 8 building pads are in use' };
  if (side.res.c < d.cost.c) return { ok: false, msg: `Need ${Math.ceil(d.cost.c - side.res.c)} more credits` };
  if (side.res.e < d.cost.e) return { ok: false, msg: `Need ${Math.ceil(d.cost.e - side.res.e)} more energy` };
  side.res.c -= d.cost.c; side.res.e -= d.cost.e;
  const nb = mkBuilding(g, s, type, slot);
  nb.spent = { c: d.cost.c, e: d.cost.e };
  return { ok: true, msg: `Building ${d.name}` };
}

// Selling returns half of everything spent on the building, plus queued units in full
const SELL_RATE = 0.5;
function sellValue(b) { return { c: Math.floor(b.spent.c * SELL_RATE), e: Math.floor(b.spent.e * SELL_RATE) }; }
function trySell(g, s, b) {
  const d = BDEF[b.type], side = g.sides[s];
  if (g.over) return { ok: false, msg: 'The match is over' };
  if (g.countdown > 0) return WAIT_GO;
  if (b.type === 'hq') return { ok: false, msg: 'The Command HQ can’t be sold' };
  if (b.hp <= 0) return { ok: false, msg: 'That building is gone' };
  const r = sellValue(b);
  side.res.c += r.c; side.res.e += r.e;
  for (const q of b.queue) { side.res.c += UDEF[q].cost.c; side.res.e += UDEF[q].cost.e; }
  b.queue.length = 0; b.hp = 0; b.dead = true; b.sold = true;
  if (b.slot >= 0 && side.slots[b.slot] === b) side.slots[b.slot] = null;
  for (let i = 0; i < 10; i++) {
    const w = P(b.u + rand(-b.half, b.half), b.v + rand(-b.half, b.half), rand(0, b.h * 0.5));
    addPart(g, { x: w.x, y: w.y, vx: rand(-20, 20), vy: rand(-30, -8), life: rand(0.6, 1.2), size: rand(4, 8), smoke: true, light: true, grav: -5 });
  }
  return { ok: true, msg: `${d.name} sold for ${r.c} credits` + (r.e ? ` and ${r.e} energy` : '') };
}

function tryUpgrade(g, s, b) {
  const d = BDEF[b.type], side = g.sides[s];
  if (g.over) return { ok: false, msg: 'The match is over' };
  if (g.countdown > 0) return WAIT_GO;
  if (!b.built) return { ok: false, msg: `${d.name} is still under construction` };
  if (b.upgrading) return { ok: false, msg: 'Upgrade already in progress' };
  if (b.tier >= 3) return { ok: false, msg: `${d.name} is fully upgraded` };
  const up = d.up[b.tier + 1];
  if (side.res.c < up.c) return { ok: false, msg: `Need ${Math.ceil(up.c - side.res.c)} more credits` };
  if (side.res.e < up.e) return { ok: false, msg: `Need ${Math.ceil(up.e - side.res.e)} more energy` };
  side.res.c -= up.c; side.res.e -= up.e;
  b.spent.c += up.c; b.spent.e += up.e;
  b.upgrading = true; b.upProg = 0;
  return { ok: true, msg: `Upgrading ${d.name} to T${b.tier + 1}` };
}

function tryTrain(g, s, type) {
  const d = UDEF[type], side = g.sides[s];
  if (g.over) return { ok: false, msg: 'The match is over' };
  if (g.countdown > 0) return WAIT_GO;
  const prods = g.ents.filter(e => e.kind === 'b' && e.side === s && e.type === d.from && e.built && e.hp > 0 && e.tier >= d.tier);
  if (!prods.length) return { ok: false, msg: unitLockMsg(d) };
  const cap = popCap(g, s);
  if (popUsed(g, s) + d.pop > cap) return { ok: false, msg: cap >= POP_MAX ? 'Army is at maximum size' : 'Army is full — build or upgrade a Habitat' };
  if (side.res.c < d.cost.c) return { ok: false, msg: `Need ${Math.ceil(d.cost.c - side.res.c)} more credits` };
  if (side.res.e < d.cost.e) return { ok: false, msg: `Need ${Math.ceil(d.cost.e - side.res.e)} more energy` };
  prods.sort((a, b) => a.queue.length - b.queue.length);
  const p = prods[0];
  if (p.queue.length >= 5) return { ok: false, msg: 'Production queue is full' };
  side.res.c -= d.cost.c; side.res.e -= d.cost.e;
  p.queue.push(type);
  return { ok: true, msg: `${d.name} queued` };
}

function spawnUnit(g, s, type, u, v) {
  const d = UDEF[type];
  const unit = { id: g.nid++, kind: 'u', type, side: s, u, v, z: d.air ? (type === 'interceptor' ? rand(100, 124) : rand(70, 94)) : 0,
    laneV: rand(-LANE_V, LANE_V), hp: d.hp, maxHp: d.hp, cd: Math.random() * 0.5, face: dirOf(s), anim: Math.random() * 10,
    moving: false, rallyOff: -Math.random() * 100, recoil: 0, hitT: 0 };
  g.ents.push(unit);
  g.sides[s].stats.built++;
  return unit;
}

// The HQ is shielded while any other building on that side still stands
function refreshShields(g) {
  for (let s = 0; s < 2; s++) {
    const hq = g.sides[s].hq, sh = g.ents.some(b => b.kind === 'b' && b.side === s && b.type !== 'hq' && b.hp > 0);
    if (hq.shielded && !sh) ev(g, { type: 'shieldDown', side: s, seen: !!g.fog && visibleTo(g, 1 - s, hq) });
    hq.shielded = sh;
  }
}
// Top-bar readout for one side's HQ. With a viewer, an enemy HQ out of sight shows what the viewer last saw.
function hqStatus(g, s, viewer = s) {
  const hq = g.sides[s].hq;
  if (viewer !== s && !g.over && hq.hp > 0 && !visibleTo(g, viewer, hq)) {
    const k = g.fog[viewer].lastHQ;
    return { hp: k.hp, maxHp: k.maxHp, frac: k.hp / k.maxHp, state: k.shielded ? 'shielded' : 'exposed', stale: true };
  }
  const hp = Math.max(0, hq.hp);
  return { hp, maxHp: hq.maxHp, frac: hp / hq.maxHp, state: hp <= 0 || hq.dead ? 'destroyed' : hq.shielded ? 'shielded' : 'exposed' };
}

/* ---------- Fog of war ----------
   Each side sees full-depth strips of the lane around its own units, buildings and held field nodes.
   Depth counts for little in range (DV_W), so strips match how far things can actually shoot. */
const FOG_CELL = 10, FOG_N = Math.ceil(L / FOG_CELL) + 1;
const SIGHT = { rifle: 170, heavy: 180, sniper: 220, tank: 210, artillery: 200, titan: 240, aircraft: 260, interceptor: 280 };
const B_SIGHT = { hq: 520, turret: 340 }, B_SIGHT_DEF = 200, NODE_SIGHT = 220; // HQ 520 ≥ its T3 range (470)
const INTEL_TTL = 45, THREAT_MEMORY = 5, SPOT_GAP = 10;
const cellOf = u => clamp(Math.floor(u / FOG_CELL), 0, FOG_N - 1);
const sightOf = e => e.kind === 'u' ? SIGHT[e.type] : (B_SIGHT[e.type] || B_SIGHT_DEF);
const ghostOf = b => ({ id: b.id, type: b.type, side: b.side, slot: b.slot, tier: b.tier, u: b.u, v: b.v, half: b.half });
function newFog(g, s) {
  const ehq = g.sides[1 - s].hq, f = { vis: new Uint8Array(FOG_N), exp: new Uint8Array(FOG_N), ghosts: {}, intel: {},
    lastHQ: { hp: ehq.hp, maxHp: ehq.maxHp, shielded: false, tier: 1 }, lastSpot: -99, seenUnits: 0 };
  // Start positions are known: the enemy HQ begins as a ghost on explored ground
  f.ghosts[ehq.id] = ghostOf(ehq);
  for (let i = cellOf(ehq.u - ehq.half - 40); i <= cellOf(ehq.u + ehq.half + 40); i++) f.exp[i] = 1;
  return f;
}
function cellsLit(vis, u, half) { for (let i = cellOf(u - half); i <= cellOf(u + half); i++) if (vis[i]) return true; return false; }
// The vision rule, kept apart from weapon range: can side s see entity e right now?
function visibleTo(g, s, e) {
  if (e.side === s) return true;
  return cellsLit(g.fog[s].vis, e.u, e.kind === 'b' ? e.half : 0);
}
function updateVision(g) {
  for (let s = 0; s < 2; s++) {
    const f = g.fog[s], vis = f.vis, exp = f.exp;
    vis.fill(0);
    const reveal = (u, r) => { for (let i = cellOf(u - r), b = cellOf(u + r); i <= b; i++) vis[i] = 1; };
    for (const e of g.ents) if (e.side === s && e.hp > 0) reveal(e.u, sightOf(e));
    for (const n of g.nodes) if (n.owner === s) reveal(n.u, NODE_SIGHT);
    for (let i = 0; i < FOG_N; i++) if (vis[i]) exp[i] = 1;
    // Remember what is in view; forget remembered things whose spot is in view but empty
    const seenB = new Set(), seenU = new Set();
    for (const e of g.ents) {
      if (e.side === s || e.hp <= 0 || !visibleTo(g, s, e)) continue;
      if (e.kind === 'b') {
        seenB.add(e.id); f.ghosts[e.id] = ghostOf(e);
        if (e.type === 'hq') f.lastHQ = { hp: e.hp, maxHp: e.maxHp, shielded: !!e.shielded, tier: e.tier };
      } else { seenU.add(e.id); f.intel[e.id] = { type: e.type, u: e.u, t: g.t }; }
    }
    for (const id in f.ghosts) { const gh = f.ghosts[id]; if (!seenB.has(gh.id) && cellsLit(vis, gh.u, gh.half)) delete f.ghosts[id]; }
    for (const id in f.intel) { const m = f.intel[id]; if (g.t - m.t > INTEL_TTL || (!seenU.has(+id) && vis[cellOf(m.u)])) delete f.intel[id]; }
    if (!f.seenUnits && seenU.size && g.t - f.lastSpot >= SPOT_GAP) { f.lastSpot = g.t; ev(g, { type: 'spotted', side: s }); }
    f.seenUnits = seenU.size;
  }
}

function update(g, dt) {
  updateFx(g, dt);
  if (g.over) return;
  refreshShields(g);
  updateVision(g);
  if (g.countdown > 0) { // GET READY: orders can be queued, but nothing progresses and the AI waits
    g.countdown = g.countdown - dt > 1e-9 ? g.countdown - dt : 0; // snap float residue so GO lands on time
    if (g.countdown === 0) ev(g, { type: 'go' });
    return;
  }
  g.t += dt;
  for (let s = 0; s < 2; s++) {
    const inc = income(g, s), side = g.sides[s];
    side.res.c += inc.c * dt; side.res.e += inc.e * dt;
    side.buff = hasTier(g, s, 'techlab', 3);
  }
  updateNodes(g, dt);
  const foes = [[], []]; // foes[s] = everything hostile to side s
  g.front = [null, null];
  for (const e of g.ents) {
    if (e.hp <= 0) continue;
    foes[1 - e.side].push(e);
    if (e.kind === 'u' && e.type !== 'interceptor') {
      const f = g.front[e.side];
      if (f === null || (e.side === 0 ? e.u > f : e.u < f)) g.front[e.side] = e.u;
    }
  }
  const n = g.ents.length;
  for (let i = 0; i < n; i++) {
    const e = g.ents[i];
    if (e.hp <= 0) continue;
    if (e.kind === 'b') updateBuilding(g, e, foes[e.side], dt); else updateUnit(g, e, foes[e.side], dt);
  }
  updateProjs(g, dt);
  updateAbilities(g, dt);
  aiUpdate(g, 1, dt); aiSpotter(g, 1);
  if (g.auto) { aiUpdate(g, 0, dt); aiSpotter(g, 0); }
  if (g.ents.some(e => e.hp <= 0)) g.ents = g.ents.filter(e => e.hp > 0);
}

function updateNodes(g, dt) {
  for (const n of g.nodes) {
    let c0 = 0, c1 = 0;
    for (const e of g.ents) if (e.kind === 'u' && e.hp > 0 && !UDEF[e.type].air && Math.abs(e.u - n.u) <= NODE_R) { if (e.side === 0) c0++; else c1++; }
    n.c = [c0, c1];
    if (c0 && !c1) n.prog = Math.min(100, n.prog + 8 * Math.sqrt(c0) * dt);
    else if (c1 && !c0) n.prog = Math.max(-100, n.prog - 8 * Math.sqrt(c1) * dt);
    let o = n.owner;
    if (n.prog >= 100) o = 0; else if (n.prog <= -100) o = 1;
    else if ((o === 0 && n.prog <= 0) || (o === 1 && n.prog >= 0)) o = null;
    if (o !== n.owner) { ev(g, { type: 'node', side: o === null ? n.owner : o, lost: o === null }); n.owner = o; }
  }
}

function tryRepair(g, s, b) {
  const d = BDEF[b.type], side = g.sides[s];
  if (g.over) return { ok: false, msg: 'The match is over' };
  if (g.countdown > 0) return WAIT_GO;
  if (!b.built) return { ok: false, msg: `${d.name} is still under construction` };
  const missing = b.maxHp - b.hp - (b.repair || 0);
  if (missing < 1) return { ok: false, msg: `${d.name} is already being fully repaired` };
  const cost = repairCost(b);
  if (side.res.c < cost) return { ok: false, msg: `Need ${Math.ceil(cost - side.res.c)} more credits` };
  side.res.c -= cost; b.repair = (b.repair || 0) + missing;
  return { ok: true, msg: `Repairing ${d.name}` };
}
const repairCost = b => Math.ceil(Math.max(0, b.maxHp - b.hp - (b.repair || 0)) * 0.3);

function updateBuilding(g, b, foes, dt) {
  const d = BDEF[b.type];
  b.anim += dt;
  if (b.hitT > 0) b.hitT -= dt;
  if (!b.built) {
    const dp = dt / d.time;
    b.progress = Math.min(1, b.progress + dp);
    b.hp = Math.min(b.maxHp, b.hp + b.maxHp * 0.85 * dp);
    if (b.progress >= 1) { b.built = true; ev(g, { type: 'built', side: b.side, name: d.name }); }
    return;
  }
  // Paid repair is fast; after a quiet spell every building also slowly patches itself up
  if (b.repair > 0) {
    const h = Math.min(b.repair, b.maxHp * 0.06 * dt, b.maxHp - b.hp);
    b.hp += h; b.repair -= h;
    if (b.hp >= b.maxHp - 0.01) b.repair = 0;
    if (Math.random() < dt * 6) { const w = P(b.u + rand(-b.half, b.half) * 0.6, b.v + rand(-b.half, b.half) * 0.6, b.h * rand(0.2, 0.9)); addPart(g, { x: w.x, y: w.y, vx: rand(-8, 8), vy: rand(-30, -10), life: 0.5, size: 1.6, color: '#7dffb0', grav: 0 }); }
  } else if (g.t - (b.lastHit ?? -99) > REGEN_DELAY && b.hp < b.maxHp) b.hp = Math.min(b.maxHp, b.hp + b.maxHp * 0.01 * dt);
  if (b.upgrading) {
    const up = d.up[b.tier + 1];
    b.upProg = Math.min(1, b.upProg + dt / up.time);
    if (b.upProg >= 1) {
      const old = b.maxHp;
      b.tier++; b.maxHp = d.hp * hpMul(d, b.tier); b.hp = Math.min(b.maxHp, b.hp + b.maxHp - old);
      b.upgrading = false; b.upProg = 0;
      ev(g, { type: 'upgraded', side: b.side, name: d.name, tier: b.tier });
    }
  }
  if (b.queue.length) {
    b.prodT += dt;
    const ut = b.queue[0];
    if (b.prodT >= UDEF[ut].time) {
      b.prodT = 0; b.queue.shift();
      spawnUnit(g, b.side, ut, b.u + dirOf(b.side) * (b.half + 10), b.v + rand(-12, 12));
    }
  }
  if (b.type === 'refinery' && Math.random() < dt * 2.2) {
    const w = P(b.u, b.v - 32 * BS, (50 + (b.tier >= 3 ? 10 : 0)) * BS);
    addPart(g, { x: w.x, y: w.y, vx: rand(-4, 4), vy: rand(-22, -12), life: rand(1.2, 2), size: rand(3, 5), smoke: true, light: true, grav: -4 });
  }
  if (b.hp < b.maxHp * 0.5 && Math.random() < dt * 3) {
    const w = P(b.u + rand(-b.half, b.half), b.v + rand(-b.half, b.half), b.h * rand(0.3, 0.7));
    addPart(g, { x: w.x, y: w.y, vx: rand(-6, 6), vy: rand(-28, -14), life: rand(1, 1.8), size: rand(4, 7), smoke: true, grav: -6 });
  }
  const gun = d.gun && d.gun[b.tier];
  if (gun) {
    if (b.cd > 0) b.cd -= dt;
    const { best } = acquire(g, b, gun, foes);
    if (best) {
      b.aim = { u: best.u, v: best.v, z: aimZ(best) };
      if (b.cd <= 0) { fire(g, b, best, gun); b.cd = gun.cd; }
    }
  }
}

// Lane-style range: sideways spread counts for less, so units can't slip past each other
function effDist(a, b) { return Math.max(0, Math.hypot(a.u - b.u, (a.v - b.v) * DV_W) - (b.kind === 'b' ? b.half : 0)); }

function acquire(g, src, def, foes) {
  let best = null, bs = 1e9, close = false;
  const minR = def.minRange || 0;
  for (const e of foes) {
    if (e.hp <= 0 || e.shielded) continue; // don't waste shots on a shielded HQ
    if (!visibleTo(g, src.side, e)) continue; // auto-target only what your side can see (spotters needed beyond sight)
    const air = e.kind === 'u' && !!UDEF[e.type].air;
    if (air ? !def.hitsAir : def.hitsGround === false) continue;
    const dist = effDist(src, e);
    if (dist > def.range) continue;
    if (dist < minR) { close = true; continue; }
    // prefer units over buildings, targets this weapon counters, and wounded targets
    const mult = DMG[def.weapon][e.kind === 'b' ? 'building' : UDEF[e.type].armor];
    if (!mult) continue; // this weapon can't hurt it (e.g. Turret gatling vs buildings)
    const sc = dist + (e.kind === 'b' ? 80 : 0) - (mult - 1) * 45 - (1 - e.hp / e.maxHp) * 25;
    if (sc < bs) { bs = sc; best = e; }
  }
  return { best, close };
}

function setStance(g, s, v) {
  const side = g.sides[s];
  side.stance = v; side.stanceAt = g.t; side.pushTo = null; side.pushMode = null;
  for (const u of g.ents) if (u.kind === 'u' && u.side === s) {
    if (v === 'hold') { u.holdU = u.u; u.holdV = u.v; } else { u.holdU = undefined; u.holdV = undefined; }
  }
}

function moveToward(u, d, tu, tv, dt) {
  const du = tu - u.u, dv = tv - u.v;
  if (Math.abs(du) < 2 && Math.abs(dv) < 2) { u.moving = false; return false; }
  if (Math.abs(du) >= 2) { u.u = clamp(u.u + Math.sign(du) * Math.min(Math.abs(du), d.speed * dt), 0, L); u.face = Math.sign(du); }
  if (Math.abs(dv) >= 1) u.v += Math.sign(dv) * Math.min(Math.abs(dv), d.speed * 0.45 * dt);
  u.moving = true;

}

function updateUnit(g, u, foes, dt) {
  const d = UDEF[u.type];
  u.anim += dt;
  if (u.cd > 0) u.cd -= dt;
  if (u.recoil > 0) u.recoil = Math.max(0, u.recoil - dt * 5);
  if (u.hitT > 0) u.hitT -= dt;
  const side = g.sides[u.side], dir = dirOf(u.side), home = rallyU(u.side) + u.rallyOff * dir;
  const { best, close } = acquire(g, u, d, foes);

  if (side.stance === 'retreat' && Math.abs(home - u.u) > 12) {
    if (best && u.cd <= 0) { fire(g, u, best, d); u.cd = d.cd * rand(0.9, 1.1); }
    moveToward(u, d, home, u.laneV, dt);
    return;
  }
  if (best) {
    u.moving = false;
    if (Math.abs(best.u - u.u) > 1) u.face = best.u >= u.u ? 1 : -1;
    if (u.cd <= 0) { fire(g, u, best, d); u.cd = d.cd * rand(0.9, 1.1); }
    return;
  }
  if (close) { u.moving = false; return; } // artillery: enemy is inside minimum range
  let tu = home, tv = u.laneV;
  if (side.stance === 'attack') {

    const spread = side.pushMode === 'siege' ? -1 : 1;
    const end = side.pushTo !== null ? side.pushTo - spread * u.rallyOff * dir * 0.6 : (dir > 0 ? L : 0);
    if (u.id === side.spotter && side.spotU != null && side.pushTo !== null) tu = side.spotU;
    else if (u.type === 'interceptor') { const f = g.front[u.side]; tu = f === null ? home : f - dir * 40; }
    else tu = end;
  } else if (side.stance === 'hold' && u.holdU !== undefined) { tu = u.holdU; tv = u.holdV; }
  if (!moveToward(u, d, tu, tv, dt)) u.face = dir;
}

function muzzle(src) {

  const m = MUZ[src.type];
  return { u: src.u + src.face * m[0] * US, v: src.v, z: (src.z || 0) + m[1] * US };
}
function aimZ(e) {

function fire(g, src, t, def) {

  const p = { u: m.u, v: m.v, z: m.z, pu: m.u, pv: m.v, pz: m.z, tu: t.u, tv: t.v, tz: aimZ(t), target: t, side: src.side,
    weapon: def.weapon, dmg: def.dmg * (g.sides[src.side].buff ? 1.2 : 1), splash: def.splash || 0, t: 0 };
  if (def.weapon === 'shell') {
    p.su = m.u; p.sv = m.v; p.sz = m.z;

  if (src.kind === 'u') src.recoil = 1;

/* ---------- Commander abilities (Step 6) ----------

const ABIL = {
  shield: { name: 'Emergency Shield', cost: { c: 75, e: 75 }, cd: 50, first: 60, r: 110, dur: 7, cut: 0.4,
    tip: 'Your units inside the circle take 40% less damage for 7 s. The shield moves with them and never stacks.' },
  strike: { name: 'Orbital Strike', cost: { c: 150, e: 150 }, cd: 100, first: 120, r: 70, delay: 3, dmg: 280, edge: 140, req: 'factory',
    tip: 'After a 3 s warning: 280 damage at the centre, 140 at the edge, to enemy ground units and buildings. Not aircraft or a shielded HQ. Target any explored ground.' },
  repair: { name: 'Repair Pulse', cost: { c: 100, e: 75 }, cd: 60, first: 60, r: 120, dur: 6, rate: 0.06,

  if (A.req && !hasBuilt(g, s, A.req)) return { ok: false, msg: `${A.name} needs a ${BDEF[A.req].name}` };
  const wait = side.ab[k] - g.t;
  if (wait > 0) return { ok: false, msg: `${A.name} is ready in ${Math.ceil(wait)} s` };
  if (side.res.c < A.cost.c) return { ok: false, msg: `Need ${Math.ceil(A.cost.c - side.res.c)} more credits` };
  if (side.res.e < A.cost.e) return { ok: false, msg: `Need ${Math.ceil(A.cost.e - side.res.e)} more energy` };

function updateAbilities(g, dt) {

        if (e.side !== a.side || e.hp <= 0 || e.hp >= e.maxHp || (e.kind === 'b' && !e.built) || !inAbil(e, a.u, a.v, A.r)) continue;

function updateProjs(g, dt) {
  for (const p of g.projs) {
    p.t += dt;
    p.pu = p.u; p.pv = p.v; p.pz = p.z;
    if (p.weapon === 'shell') {
      const k = Math.min(1, p.t / p.T);
      p.u = lerp(p.su, p.tu, k); p.v = lerp(p.sv, p.tv, k);
      p.z = lerp(p.sz, 0, k) + p.arc * 4 * k * (1 - k);
      if (Math.random() < 0.5) { const w = P(p.u, p.v, p.z); addPart(g, { x: w.x, y: w.y, vx: 0, vy: 0, life: 0.35, size: 2, smoke: true, light: true }); }
      if (k >= 1) { impact(g, p, null); p.done = true; }
      continue;
    }
    if (p.target && p.target.hp > 0) { p.tu = p.target.u; p.tv = p.target.v; p.tz = aimZ(p.target); }
    else p.target = null;

    p.u += du / dist * step; p.v += dv / dist * step; p.z += dz / dist * step;
    if ((p.weapon === 'rocket' || p.weapon === 'hqgun' || p.weapon === 'missile') && Math.random() < 0.7) {
      const w = P(p.u, p.v, p.z);
      addPart(g, { x: w.x, y: w.y, vx: rand(-5, 5), vy: rand(-5, 5), life: 0.4, size: 2.2, smoke: true, light: true });
    }
    if (p.t > 4) p.done = true;
  }

}

function splashHit(g, p, hit, scale, falloffFloor) {
  for (const e of g.ents) {
    if (e === hit || e.side === p.side || e.hp <= 0 || (e.kind === 'u' && UDEF[e.type].air)) continue;
    const dx = Math.max(0, Math.hypot(e.u - p.u, (e.v - p.v) * 0.6) - (e.kind === 'b' ? e.half : 0));
    if (dx < p.splash) damage(g, e, p.dmg * scale * (1 - falloffFloor * dx / p.splash), p.weapon, p.side);
  }
}

function impact(g, p, hit) {
  const w = P(p.u, p.v, p.z);
  if (p.weapon === 'shell') { splashHit(g, p, null, 1, 0.5); fxBoom(g, w.x, w.y, 30); return; }
  if (hit && hit.hp > 0) damage(g, hit, p.dmg, p.weapon, p.side);
  if (p.splash > 0) splashHit(g, p, hit, 0.5, 1);
  if (p.weapon === 'rifle' || p.weapon === 'rail' || p.weapon === 'gatling') {
    for (let i = 0; i < (p.weapon === 'rail' ? 5 : 2); i++)
      addPart(g, { x: w.x, y: w.y, vx: rand(-40, 40), vy: rand(-50, 0), life: 0.18, size: 1.3, color: p.weapon === 'rail' ? '#c9f6ff' : '#fff3b0', grav: 200 });
  } else fxBoom(g, w.x, w.y, p.weapon === 'siege' ? 26 : p.weapon === 'cannon' ? 18 : p.weapon === 'flak' ? 8 : 12);
}

function damage(g, e, amt, weapon, fromSide) {
  if (e.shielded) return;
  const armor = e.kind === 'b' ? 'building' : UDEF[e.type].armor;
  const mult = DMG[weapon][armor];
  if (!mult) return;
  e.hp -= amt * mult * (g.sides[e.side].buff ? 0.85 : 1) * (e.shT > g.t ? 1 - ABIL.shield.cut : 1); // Emergency Shield
  e.hitT = 0.12;
  if (e.kind === 'b') {
    e.lastHit = g.t;
    const side = g.sides[e.side];
    if (g.t - side.lastAlert > 10) { side.lastAlert = g.t; ev(g, { type: 'alert', side: e.side, hq: e.type === 'hq' }); }
  }
  if (e.hp <= 0) kill(g, e, fromSide);
}

function kill(g, e, by) {
  if (e.dead) return;
  e.dead = true; e.hp = 0;
  const side = g.sides[e.side];
  if (e.kind === 'u') {
    side.stats.lost++;
    if (by >= 0) g.sides[by].stats.kills++;
    const d = UDEF[e.type], w = P(e.u, e.v, aimZ(e));
    fxBoom(g, w.x, w.y, d.air ? 28 : e.type === 'rifle' || e.type === 'sniper' ? 9 : e.type === 'heavy' ? 15 : e.type === 'titan' ? 46 : 30);
    return;
  }
  if (e.slot >= 0 && side.slots[e.slot] === e) side.slots[e.slot] = null;
  for (let i = 0; i < 3; i++) { const w = P(e.u + rand(-e.half, e.half) * 0.6, e.v + rand(-e.half, e.half) * 0.6, rand(10, e.h * 0.7)); fxBoom(g, w.x, w.y, rand(36, 56)); }
  ev(g, { type: 'destroyed', side: e.side, name: BDEF[e.type].name, hq: e.type === 'hq', seen: visibleTo(g, 1 - e.side, e) });
  if (e.type === 'hq') {
    g.over = true; g.winner = 1 - e.side;
    for (let i = 0; i < 6; i++) { const w = P(e.u + rand(-50, 50), e.v + rand(-50, 50), rand(0, 100)); fxBoom(g, w.x, w.y, rand(50, 80)); }

function addPart(g, p) { p.max = p.life; if (g.parts.length < 520) g.parts.push(p); }

  for (let i = 0; i < n; i++) {
    const a = rand(-Math.PI, 0), sp = rand(40, 130) * size / 30;
    addPart(g, { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.25, 0.7), size: rand(1.2, 2.6) * Math.max(1, size / 24), color: i % 3 ? '#ffb347' : '#fff1a8', grav: 240 });
  }
  for (let i = 0; i < n / 2; i++)
    addPart(g, { x: x + rand(-size / 3, size / 3), y: y - rand(0, size / 3), vx: rand(-14, 14), vy: rand(-32, -8), life: rand(0.8, 1.5), size: rand(3, 7) * Math.max(1, size / 30), smoke: true, grav: -8 });

}
function updateFx(g, dt) {
  if (g.shake > 0) g.shake = Math.max(0, g.shake - dt * 18);
  for (const p of g.parts) {
    p.life -= dt;
    p.vy += (p.grav || 0) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;

/* ---------- Enemy AI: same economy, same rules, same upgrades as the player ---------- */
// Known base defenses: the enemy HQ gun plus remembered Turrets, each at its last-seen tier
const HQ_VAL = 400, TURRET_VAL = 300;

  // The enemy army as this side knows it: units it has seen, fading out over INTEL_TTL seconds
  const theirs = Object.values(fog.intel).map(m => ({ type: m.type, u: m.u, w: Math.max(0, 1 - (g.t - m.t) / INTEL_TTL), fresh: g.t - m.t <= THREAT_MEMORY }));

  const nearLight = armyValue(near.filter(u => UDEF[u.type].armor === 'light'));

  const infantryRush = lightThreat && nearLight >= 400; // a real rush (about 8 Riflemen), not a couple of scouts
  const calm = D.calmTech && threat, saving = D.calmSave && threat; // threat-aware: hold tech; save for counters
  if (side.spotsRush === undefined) side.spotsRush = Math.random() < D.turret; // reaction quality, decided once per match
  const cap = popCap(g, s);

  const P = side.persona || (side.persona = rollPersona());

  // 1) Economy and tech

  else if (calm && hasBuilt(g, s, 'barracks') && countB(g, s, 'factory') < 1) want = 'factory'; // the Tank counter to an infantry rush
  else if (P.kind === 'aggressor' && D !== DIFF.easy && !threat && hasBuilt(g, s, 'barracks') && countB(g, s, 'factory') < 1 && aiFortified(g, s)) want = 'factory'; // a fortified enemy: the Orbital Strike needs a War Factory
  else if (D.eco && !defend && side.res.e > ENERGY_PLENTY * 2 && side.res.c < 300 && countB(g, s, 'refinery') < 4 &&
    (countB(g, s, 'habitat') > 0 || side.slots.filter(x => !x).length >= 2)) want = 'refinery'; // turn spare energy into credits (leaving room for a Habitat)
  else if (D.eco && side.res.e < 120 && side.res.c > 800 && countB(g, s, 'reactor') < 3 &&

// Assigning a canvas's width or height clears it, even to the same value, so only touch it on a real change

  V.dpr = Math.min(2, window.devicePixelRatio || 1);

const HQ_STATE = { shielded: 'Shielded', exposed: 'Exposed', destroyed: 'Destroyed' };

function handleEvents() {
  for (const e of game.events) {
    if (e.type === 'built' && e.side === 0) { toast(`${e.name} is ready`, 'ok'); sndPlay('built'); }
    else if (e.type === 'upgraded' && e.side === 0) { toast(`${e.name} reached T${e.tier}`, 'ok'); sndPlay('upgrade'); }
    else if (e.type === 'alert' && e.side === 0) { toast(e.hq ? 'Your HQ is under attack' : 'Your base is under attack', 'warn'); sndPlay('alarm'); }
    else if (e.type === 'over') sndPlay(e.winner === 0 ? 'victory' : 'defeat');
    else if (e.type === 'destroyed' && e.side === 1 && !e.seen && !e.hq) continue; // happened out of sight
    else if (e.type === 'destroyed') toast(e.side === 0 ? `${e.name} destroyed` : `Enemy ${e.name} destroyed`, e.side === 0 ? 'bad' : 'ok');
    else if (e.type === 'spotted' && e.side === 0) { toast('Enemy units spotted', 'warn'); sndPlay('ping'); }
    else if (e.type === 'node') { if (e.side === 0 && !e.lost) sndPlay('node'); toast(e.lost ? (e.side === 0 ? 'You lost a field node' : 'Enemy lost a field node') : (e.side === 0 ? 'Field node captured: +3 credits, +1 energy per second' : 'Enemy captured a field node'), (e.side === 0) === !e.lost ? 'ok' : 'warn'); }
    else if (e.type === 'go') showGo();
    else if (e.type === 'shieldDown' && e.side === 1 && !e.seen) continue;
    else if (e.type === 'shieldDown') toast(e.side === 1 ? 'Enemy HQ shield is down. Finish it!' : 'Your HQ shield is down', e.side === 1 ? 'ok' : 'bad');
  }
  game.events.length = 0;
}

/* ---------- Touch: drag left/right to scroll, tap a building or pad ---------- */
let gest = null;

function handleTap(x, y) {
  if (!game) return;

  if (hits.length) {
    // tapping the same spot again steps to the building behind
    let pick = hits[0];
    if (tapCycle && Math.hypot(x - tapCycle.x, y - tapCycle.y) < 24 && sel && hits.includes(sel)) pick = hits[(hits.indexOf(sel) + 1) % hits.length];
    tapCycle = { x, y };

    return;

    const p = slotPos(0, k), q = P(p.u, p.v);
    if (!game.sides[0].slots[k] && inDiamond(w.x, w.y, q.x, q.y, PAD_H + 4)) { openPad(k); return; }

}
cv.addEventListener('pointerdown', e => {

    <div class="how">

      <div><b>Control the field</b>Ground troops standing on a field node capture it for extra income. Your HQ is shielded while any other building stands.</div>
      <div><b>Command your army</b>Attack pushes forward, Hold stops everyone where they stand, Retreat pulls back to your flag. Drag sideways to look around.</div>
    </div>
    <div class="row"><span class="lbl">Difficulty</span>${diffSeg()}</div>
    <div class="row">${sv ? `<button class="big" id="bResume">Resume match</button><button class="ghost" id="bPlay">New match</button><span class="lbl">${DIFF[sv.diffKey] ? DIFF[sv.diffKey].label : ''}, ${fmtTime(sv.t)} in</span>` : '<button class="big" id="bPlay">Start match</button>'}<button class="ghost" id="bSound">${sndLabel()}</button></div>`);
  wireDiff(); wireSound();
  $('bPlay').addEventListener('click', startGame);
  if (sv) $('bResume').addEventListener('click', resumeGame);
}
function resumeGame() {
  let g = null;
  try { g = deserialize(localStorage.getItem(SAVE_KEY)); } catch (e) { g = null; }
  if (!g) { clearSave(); toast('That save could not be loaded', 'bad'); showStart(); return; }
  clearTimeout(endTimer); endTimer = null;
  game = g; diffKey = g.diffKey;
  hideCountdown(); applyZoom(1);
  resize(); closePanel(); hideInfo();
  if (typeof g.extra.camX === 'number') { cam.x = g.extra.camX; cam.vx = 0; clampCam(); } else homeCamera();
  speed = g.extra.speed || 1; $('bSpeed').textContent = speed + '×';
  running = true; paused = false;
  tab = 'build';
  for (const x of document.querySelectorAll('.tabs button')) x.classList.toggle('on', x.dataset.tab === 'build');
  hideOverlay(); buildCards(); refreshUI(true);
  pauseGame(true); // a restored match waits for the player to tap Resume
}
function startGame() {
  clearTimeout(endTimer); endTimer = null;
  game = newGame(diffKey, { countdown: INTRO_T + COUNTDOWN });
  hideCountdown(); camTouched = false;
  resize(); introCamera(0); closePanel();
  running = true; paused = false; speed = 1; $('bSpeed').textContent = '1×';
  tab = 'build';
  for (const x of document.querySelectorAll('.tabs button')) x.classList.toggle('on', x.dataset.tab === 'build');
  hideOverlay(); buildCards(); hideInfo(); endAim();
  saveGame();
  updateIntro(); refreshUI(true);
  toast('Start with a Barracks and a Refinery', 'ok');
}
function pauseGame(restored) {
  paused = true; endAim(); saveGame();
  overlay(`<h1>${restored === true ? 'Match restored' : 'Paused'}</h1><p>${DIFF[game.diffKey].label} match, ${fmtTime(game.t)} elapsed.</p>
    <div class="row"><button class="big" id="bRes">Resume</button><button class="ghost" id="bRe">Restart</button><button class="ghost" id="bMenu">Main menu</button><button class="ghost" id="bSound">${sndLabel()}</button></div>`);
  wireSound();
  $('bRes').addEventListener('click', () => { paused = false; hideOverlay(); });
  $('bRe').addEventListener('click', startGame);
  $('bMenu').addEventListener('click', showStart);
}
function fmtTime(t) { t = Math.floor(t); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; }
function showEnd() {
  const win = game.winner === 0, st = game.sides[0].stats;
  closePanel();
  overlay(`<p class="kicker">${GAME_NAME}</p><h1 class="${win ? 'win' : 'lose'}">${win ? 'Victory' : 'Defeat'}</h1>
    <p>${win ? 'The enemy Command HQ has fallen. The valley is yours.' : 'Your Command HQ was destroyed. Regroup and try a new strategy.'}</p>
    <p class="faced">You faced: <b>${PERSONA_NAME[(game.sides[1].persona || {}).kind] || 'an unknown commander'}</b></p>
    <div class="stats"><div><b>${fmtTime(game.t)}</b><small>Match time</small></div><div><b>${st.built}</b><small>Units built</small></div>
    <div><b>${st.kills}</b><small>Enemies destroyed</small></div><div><b>${st.lost}</b><small>Units lost</small></div></div>
    <div class="row"><span class="lbl">Difficulty</span>${diffSeg()}</div>
    <div class="row"><button class="big" id="bAgain">Play again</button><button class="ghost" id="bMenu2">Main menu</button></div>`);
  wireDiff();
  $('bAgain').addEventListener('click', startGame);
  $('bMenu2').addEventListener('click', showStart);
}

/* ---------- Sound (Web Audio, generated in code; no files) ----------
   One AudioContext, a master gain and a compressor so big fights don't clip. Each sound is 2–5 short-lived nodes
   that are disconnected when they end; nothing loops, so nothing can get stuck. At most 14 sounds play at once:
   small arms may use 9 of them, cannons and blasts 12, game events all 14. Each sound also has its own cap and a
   minimum gap. Battle sounds are panned by screen position, fade at the screen edge and are silent off screen; they
   come only from the effects code, which already skips anything hidden in the fog. iOS: audio starts on the first
   tap, is suspended in the background and resumed on return (or on the next tap). */
const SOUND_KEY = 'extinctionEvent.sound';
const SND = { ctx: null, master: null, noise: null, bufs: {}, on: true, voices: 0, live: 0, per: {}, last: {}, rnd: mulberry(77), played: 0, dropped: 0 };
try { SND.on = localStorage.getItem(SOUND_KEY) !== 'off'; } catch (e) {}
const SND_MAX = 14, SND_ROOM = [[3, 8, 14], [6, 10, 14], [9, 12, 14]]; // room per priority, by effect quality level (low, medium, full)

function sndInit() {
  if (SND.ctx || !SND.on) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    const ctx = new AC(), comp = ctx.createDynamicsCompressor(), master = ctx.createGain();
    comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
    master.gain.value = 0.7; master.connect(comp); comp.connect(ctx.destination);
    const nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = SND.rnd() * 2 - 1;
    const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050); s.connect(ctx.destination); s.start(0); // iOS unlock
    SND.ctx = ctx; SND.master = master; SND.noise = nb;
    sndBake();
  } catch (e) { SND.ctx = null; } // no audio: the game plays on silently
}
// Every sound is rendered once into a buffer (off the main audio graph), so playing one costs three nodes:
// a buffer source, a gain and a pan. Until a buffer is ready, that sound is synthesised live.
async function sndBake() {
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext, sr = SND.ctx.sampleRate;
  if (!OAC) return;
  const jobs = [];
  for (const name of Object.keys(SFX)) if (name === 'boom') for (const sz of [12, 30, 50]) jobs.push([`boom:${sz}`, name, sz]); else jobs.push([name, name, 0]);
  for (const [key, name, size] of jobs) {
    try {
      const oc = new OAC(1, Math.ceil(sr * 1.6), sr), v = voice(oc, 0, 1, 0, oc.destination);
      SFX[name][4](v, size);
      const buf = await oc.startRendering(), d = buf.getChannelData(0);
      let n = d.length; while (n > 1 && Math.abs(d[n - 1]) < 1e-4) n--;
      const out = SND.ctx.createBuffer(1, n, sr); out.copyToChannel(d.subarray(0, n), 0);
      SND.bufs[key] = out;
    } catch (e) { return; } // keep synthesising live
  }
}
function sndWake() { sndInit(); if (SND.ctx && SND.ctx.state !== 'running' && !document.hidden) SND.ctx.resume().catch(() => {}); }
for (const t of ['pointerdown', 'touchend', 'keydown']) document.addEventListener(t, sndWake, { capture: true, passive: true });
document.addEventListener('visibilitychange', () => {
  if (!SND.ctx) return;
  if (document.hidden) SND.ctx.suspend().catch(() => {}); else SND.ctx.resume().catch(() => {});
});
function sndSet(on) {
  SND.on = on;
  try { localStorage.setItem(SOUND_KEY, on ? 'on' : 'off'); } catch (e) {}
  if (on) sndWake();
  if (SND.master) SND.master.gain.value = on ? 0.7 : 0;
}
const sndLabel = () => `Sound: ${SND.on ? 'On' : 'Off'}`;

// A voice: a gain (and a stereo pan where supported) into the master; sources are added by the recipe
function voice(ctx, t, vol, pan, dest = SND.master) {
  const v = { ctx, t, nodes: [], end: t, last: null, out: ctx.createGain() };
  v.out.gain.value = vol;
  let tail = v.out;
  if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; v.out.connect(p); tail = p; v.nodes.push(p); }
  tail.connect(dest); v.nodes.push(v.out);
  return v;
}
function env(v, g, at, dur, peak) {
  g.gain.setValueAtTime(0.0001, at); g.gain.linearRampToValueAtTime(peak, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
}
function tone(v, type, f0, f1, dur, peak, delay = 0) {
  const { ctx } = v, at = v.t + delay, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, at); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  env(v, g, at, dur, peak); o.connect(g); g.connect(v.out); o.start(at); o.stop(at + dur + 0.02);
  v.nodes.push(o, g); if (at + dur + 0.02 >= v.end) { v.end = at + dur + 0.02; v.last = o; } return o;
}
function hiss(v, filter, f0, f1, q, dur, peak, delay = 0) {
  const { ctx } = v, at = v.t + delay, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = SND.noise; f.type = filter; f.Q.value = q;
  f.frequency.setValueAtTime(f0, at); if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, at + dur);
  env(v, g, at, dur, peak); s.connect(f); f.connect(g); g.connect(v.out);
  s.start(at, SND.rnd() * 0.5); s.stop(at + dur + 0.02);
  v.nodes.push(s, f, g); if (at + dur + 0.02 >= v.end) { v.end = at + dur + 0.02; v.last = s; } return s;
}
// name: [priority 0 small arms / 1 heavy / 2 events, per-sound cap, min gap s, global (plays without a position), recipe]
const SFX = {
  rifle:    [0, 2, 0.07, 0, v => hiss(v, 'bandpass', 2400, 1600, 1.2, 0.05, 0.5)],
  gatling:  [0, 2, 0.12, 0, v => { hiss(v, 'bandpass', 1800, 1300, 1.4, 0.045, 0.5); hiss(v, 'bandpass', 1800, 1300, 1.4, 0.045, 0.45, 0.08); }],
  flak:     [0, 2, 0.1, 0, v => { tone(v, 'triangle', 520, 300, 0.05, 0.35); tone(v, 'triangle', 520, 300, 0.05, 0.3, 0.06); }],
  rail:     [1, 2, 0.1, 0, v => { hiss(v, 'highpass', 3000, 3000, 0.7, 0.06, 0.5); tone(v, 'sine', 1500, 350, 0.18, 0.25); }],
  rocket:   [1, 2, 0.08, 0, v => hiss(v, 'bandpass', 600, 2400, 1.5, 0.3, 0.45)],
  missile:  [0, 2, 0.1, 0, v => hiss(v, 'bandpass', 900, 2600, 1.5, 0.14, 0.4)],
  cannon:   [1, 2, 0.08, 0, v => { tone(v, 'sine', 110, 45, 0.3, 0.9); hiss(v, 'lowpass', 900, 300, 0.7, 0.18, 0.5); }],
  siege:    [1, 1, 0.15, 0, v => { tone(v, 'sine', 90, 35, 0.35, 0.9); tone(v, 'sine', 90, 35, 0.35, 0.8, 0.07); hiss(v, 'lowpass', 700, 200, 0.7, 0.25, 0.5); tone(v, 'square', 140, 120, 0.08, 0.06); }],
  shell:    [1, 2, 0.15, 0, v => { tone(v, 'sine', 70, 35, 0.35, 0.9); hiss(v, 'lowpass', 500, 200, 0.7, 0.25, 0.5); }],
  whistle:  [0, 1, 0.3, 0, v => tone(v, 'sine', 1500, 600, 0.7, 0.12)],
  boom:     [1, 2, 0.06, 0, (v, s) => { const d = 0.25 + s / 80; hiss(v, 'lowpass', 400 + s * 20, 120, 0.7, d, 0.7); if (s > 28) tone(v, 'sine', 60, 30, d, 0.8); }],
  step:     [0, 1, 0.25, 0, v => { tone(v, 'sine', 55, 35, 0.16, 0.7); hiss(v, 'lowpass', 220, 150, 0.7, 0.1, 0.3); }],
  collapse: [2, 1, 0.3, 0, v => { hiss(v, 'lowpass', 320, 90, 0.7, 1.2, 0.8); tone(v, 'sine', 45, 25, 1, 0.8); }],
  hqgun:    [1, 1, 0.2, 0, v => { const o = tone(v, 'sawtooth', 220, 60, 0.28, 0.25); tone(v, 'sine', 90, 40, 0.2, 0.6); return o; }],
  built:    [2, 1, 0.3, 1, v => { tone(v, 'triangle', 660, 660, 0.12, 0.5); tone(v, 'triangle', 990, 990, 0.16, 0.5, 0.1); }],
  upgrade:  [2, 1, 0.3, 1, v => { [523, 659, 784].forEach((f, i) => tone(v, 'triangle', f, f, 0.14, 0.45, i * 0.09)); }],
  trained:  [2, 1, 0.25, 1, v => tone(v, 'sine', 880, 880, 0.07, 0.3)],
  node:     [2, 1, 0.5, 1, v => { tone(v, 'triangle', 523, 523, 0.45, 0.35); tone(v, 'triangle', 784, 784, 0.45, 0.3, 0.05); }],
  alarm:    [2, 1, 1, 1, v => { [700, 520, 700, 520].forEach((f, i) => tone(v, 'triangle', f, f, 0.13, 0.4, i * 0.15)); }],
  ping:     [2, 1, 1, 1, v => { tone(v, 'sine', 1200, 1200, 0.35, 0.3); tone(v, 'sine', 1200, 1200, 0.25, 0.12, 0.18); }],
  victory:  [2, 1, 2, 1, v => { [523, 659, 784, 1047].forEach((f, i) => tone(v, 'triangle', f, f, i === 3 ? 0.6 : 0.16, 0.5, i * 0.14)); }],
  shieldUp: [1, 1, 0.5, 0, v => { tone(v, 'sine', 300, 900, 0.35, 0.3); tone(v, 'triangle', 600, 1200, 0.3, 0.12, 0.05); }],
  pulse:    [1, 1, 0.5, 0, v => { [392, 523, 659].forEach((f, i) => tone(v, 'sine', f, f * 1.01, 0.6, 0.22, i * 0.06)); }],
  uplink:   [2, 1, 1, 1, v => { tone(v, 'square', 220, 880, 0.5, 0.08); tone(v, 'sine', 440, 1760, 0.5, 0.15, 0.05); }],
  siren:    [2, 1, 1.5, 1, v => { tone(v, 'sawtooth', 600, 900, 0.35, 0.12); tone(v, 'sawtooth', 900, 600, 0.35, 0.12, 0.35); tone(v, 'sawtooth', 600, 900, 0.35, 0.12, 0.7); }],
  orbital:  [2, 2, 0.3, 0, v => { hiss(v, 'highpass', 2500, 800, 0.7, 0.12, 0.6); tone(v, 'sine', 80, 26, 1.1, 1); hiss(v, 'lowpass', 900, 80, 0.7, 1.3, 0.9); }],
  defeat:   [2, 1, 2, 1, v => { [440, 349, 294, 220].forEach((f, i) => tone(v, 'triangle', f, f, i === 3 ? 0.7 : 0.22, 0.45, i * 0.2)); }],
};
const SND_VOL = { 0: 0.22, 1: 0.32, 2: 0.4 };
function sndPlay(name, x, size) {
  const r = SFX[name], ctx = SND.ctx;
  if (!r || !SND.on || !ctx || ctx.state !== 'running') return false;
  const [pri, cap, gap, global, fn] = r, now = ctx.currentTime;
  let vol = SND_VOL[pri], pan = 0;
  if (!global) { // position: pan across the screen, fade at the edges, silent off screen
    const off = (x - cam.x) / (V.cw / 2 / V.S || 1);
    if (Math.abs(off) > 1.15) return false;
    vol *= 1 - 0.6 * clamp((Math.abs(off) - 0.8) / 0.35, 0, 1); pan = clamp(off * 0.6, -0.8, 0.8);
  }
  if (now - (SND.last[name] ?? -9) < gap || (SND.per[name] || 0) >= cap || SND.voices >= SND_ROOM[VFX.q][pri]) { SND.dropped++; return false; }
  SND.last[name] = now; SND.per[name] = (SND.per[name] || 0) + 1; SND.voices++; SND.played++;
  const v = voice(ctx, now + 0.005, vol, pan), buf = SND.bufs[name === 'boom' ? `boom:${size < 20 ? 12 : size < 40 ? 30 : 50}` : name];
  if (buf) { // the usual path: play the baked buffer, a little detuned so repeats don't sound identical
    const src = ctx.createBufferSource(), rate = pri === 0 ? 0.94 + SND.rnd() * 0.12 : 0.97 + SND.rnd() * 0.06;
    src.buffer = buf; src.playbackRate.value = rate; src.connect(v.out); src.start(v.t);
    v.nodes.push(src); v.last = src; v.end = v.t + buf.duration / rate;
  } else fn(v, size || 0);
  SND.live += v.nodes.length;
  let ended = false;
  const done = () => { // every node of the voice is disconnected when it ends
    if (ended) return; ended = true;
    for (const n of v.nodes) { try { n.disconnect(); } catch (e) {} }
    SND.live -= v.nodes.length; SND.voices--; SND.per[name]--;
  };
  if (v.last) v.last.onended = done; else done();
  setTimeout(done, (v.end - now) * 1000 + 1500); // backstop in case 'ended' never arrives
  return true;
}

/* ---------- Main loop ---------- */
let uiT = 0, saveT = 5;
function frame(ts) {
  requestAnimationFrame(frame);
  vfxQuality(ts - last, !!(game && running && !paused));
  const dt = Math.min(0.05, Math.max(0, (ts - last) / 1000)); last = ts;
  if (game && running && !paused) {
    let rem = dt * (game.countdown > 0 ? 1 : speed); // the countdown always takes real seconds
    while (rem > 1e-6) { const st = Math.min(rem, 1 / 30); update(game, st); rem -= st; }
    updateIntro();
    handleEvents();
    if (game.over && !endTimer) { clearSave(); endTimer = setTimeout(() => { endTimer = null; if (game && game.over) { running = false; showEnd(); } }, 1900); }
    saveT -= dt;
    if (saveT <= 0 && !game.over) { saveT = 5; saveGame(); }
    uiT -= dt;
    if (uiT <= 0) { uiT = 0.15; refreshUI(false); }
  } else if (game && game.over) update(game, dt);
  if (!gest && Math.abs(cam.vx) > 5) { cam.x += cam.vx * dt; cam.vx *= Math.pow(0.03, dt); clampCam(); }
  render(ctx, game, ts / 1000, sel, selPad);
  drawMinimapNow();
}
buildAbil();
resize();
homeCamera();
showStart();
requestAnimationFrame(frame);
</script>

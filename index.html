<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070b14">
<title>Extinction Event</title>
<link rel="apple-touch-icon" href="apple-touch-icon-2.PNG">
<style>
:root{
  --bg:#060914;--glass:rgba(10,17,33,.82);--glass2:rgba(20,32,56,.9);--panel3:#1d2e4c;--line:rgba(110,150,210,.22);
  --text:#e8f1ff;--muted:#8a9cc0;--blue:#39c8ff;--red:#ff4d4d;
  --credit:#ffd34d;--energy:#5dffb0;--pop:#c49bff;--bad:#ff5a6e;--good:#5dff8a;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* The battlefield is a night-side world, so both themes share the dark palette. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060914;--text:#e8f1ff;--muted:#8a9cc0}}
:root[data-theme="dark"]{--bg:#060914;--text:#e8f1ff;--muted:#8a9cc0}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.25 -apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* The battlefield fills the whole screen, including the strip behind the viewer's top bar */
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:0}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;pointer-events:none;padding:0 calc(env(safe-area-inset-right,0px) + 6px) 0 calc(env(safe-area-inset-left,0px) + 6px)}
#hud,#panel,#bp{pointer-events:auto}
/* The top bar sits just below the viewer's own strip: that strip swallows taps, so nothing interactive goes there */
#hud{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 3px);
  left:calc(env(safe-area-inset-left,0px) + 6px);
  right:calc(env(safe-area-inset-right,0px) + 6px);
  height:40px;display:flex;align-items:center;gap:10px;padding:0 5px 0 10px;background:var(--glass);border:1px solid var(--line);border-radius:13px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.res{display:flex;align-items:center;gap:5px;min-width:0;white-space:nowrap}
.res>div{display:flex;flex-direction:column;line-height:1.05}
.res b{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.res small{color:var(--muted);font-size:9.5px;font-variant-numeric:tabular-nums}
#mm{flex:1 1 auto;min-width:60px;height:28px;border-radius:8px;display:block;touch-action:none;cursor:pointer}
.res.full b{color:var(--bad)}
/* HQ readouts either side of the overview map: blue is yours (left end of the map), red the enemy's */
.hqr{display:flex;align-items:center;gap:4px;flex:0 0 auto;--tc:var(--blue)}
#hq1{--tc:var(--red)}
.hqr>div{display:flex;flex-direction:column;gap:3px;line-height:1}
.hqr .hb{display:block;width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.hqr .hb i{display:block;height:100%;width:100%;background:var(--good)}
.hqr small{font-size:9.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.hqr .shd{width:12px;height:14px;flex:0 0 auto;overflow:visible}
.hqr .shd path{fill:var(--tc);stroke:var(--tc);stroke-width:1.3;stroke-linejoin:round}
.hqr .shd .x{display:none;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round}
.hqr.exposed .shd path{fill:transparent;stroke:var(--bad)}
.hqr.exposed small{color:var(--bad)}
.hqr.destroyed{opacity:.8}
.hqr.destroyed .shd path{fill:#5a1c22;stroke:var(--bad)}
.hqr.destroyed .shd .x{display:inline}
.hqr.destroyed small{color:var(--bad);font-weight:800}
.hqr.stale{opacity:.55}
.hqr.stale small{color:var(--muted)}
#cd{position:absolute;inset:0;padding-top:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;text-shadow:0 2px 16px rgba(0,0,0,.75);z-index:3}
#cd.hide{display:none}
#cd small{font-size:15px;font-weight:900;letter-spacing:.3em;color:var(--blue)}
#cd b{font-size:64px;line-height:1.05;font-weight:900;color:var(--text);min-height:1em}
#cd.go b{color:var(--good)}
#cd b.pop{animation:cdpop .45s ease-out}
@keyframes cdpop{from{transform:scale(1.7);opacity:0}}
.ico{display:inline-block;width:14px;height:14px;flex:0 0 auto}
.ico.c{background:var(--credit);transform:rotate(45deg) scale(.74);border-radius:2px;box-shadow:0 0 8px rgba(255,211,77,.55)}
.ico.e{background:var(--energy);clip-path:polygon(58% 0,8% 58%,44% 58%,34% 100%,92% 40%,56% 40%)}
.ico.p{background:radial-gradient(circle at 50% 27%,var(--pop) 0 23%,transparent 25%),radial-gradient(ellipse 48% 44% at 50% 100%,var(--pop) 0 98%,transparent 100%)}
.spacer{flex:1}
.seg{display:flex;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;height:32px;padding:0 9px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--panel3);color:var(--text);box-shadow:inset 0 0 0 1px rgba(57,200,255,.55)}
#stance button.on[data-s="attack"]{background:#3a1616;box-shadow:inset 0 0 0 1px rgba(255,77,77,.75);color:#ffd6d6}
#stance button.on[data-s="retreat"]{background:#3a3014;box-shadow:inset 0 0 0 1px rgba(255,211,77,.7);color:#ffeab0}
.hbtn{height:34px;min-width:40px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
#field{flex:1 1 auto;position:relative;min-height:0}
#toasts{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 50px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;width:min(70%,calc(100vw - 2 * (env(safe-area-inset-right,0px) + 70px)))}
.t{background:rgba(8,14,26,.9);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600;animation:tin .18s ease-out;transition:opacity .3s;white-space:nowrap}
.t.bad{border-color:rgba(255,90,110,.75);color:#ffc7cf}
.t.ok{border-color:rgba(93,255,138,.55)}
.t.warn{border-color:rgba(255,211,77,.75);color:#ffeab0}
.t.out{opacity:0}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}
/* While a building panel is open, toasts move to the column left of it so they never cover its title (placeToasts) */
#toasts.side{transform:none;align-items:flex-start}
#toasts.side .t{white-space:normal;border-radius:12px;line-height:1.25;padding:4px 11px}
#bp{position:absolute;right:58px;bottom:6px;width:264px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:8px 9px 9px 11px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#bp.hide{display:none}
.bph{display:flex;align-items:center;gap:7px}
.bph b{font-size:13.5px}
.pips{display:flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--credit)}
.pips i.on{background:var(--credit)}
#bpX{margin-left:auto;width:30px;height:26px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.25);font-size:15px;line-height:1}
#bpNow{color:var(--muted);margin-top:3px}
#bpNext{margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
#bpNext .no{color:var(--bad)}
.bpr{display:flex;gap:6px;margin-top:7px}
.bpr button{flex:1;height:34px;border-radius:9px;font-weight:800;font-size:12.5px}
#bpUp{border:0;background:linear-gradient(#4fd3ff,#1b8fd0);color:#001522}
#bpUp.poor,#bpUp[disabled]{background:var(--panel3);color:var(--muted)}
#bpSell{border:1px solid rgba(255,90,110,.45);background:rgba(255,77,77,.08);color:#ffc7cf}
#bpSell.arm{background:#5a1c22;border-color:var(--bad);color:#fff}
#bpSell.hide,#bpUp.hide,#bpRep.hide{display:none}
#bpRep{border:1px solid rgba(93,255,138,.45);background:rgba(93,255,138,.08);color:#c8ffd9}
#bpRep[disabled]{opacity:.6}
#cards .card.warpc svg.ic{width:30px;height:30px;margin:2px auto 0;display:block} /* Set warp point (v2.26) */
#bpUp.soon{flex:1.8;font-size:11px;line-height:1.15;padding:0 4px} /* Axiarch production: "Doctrine paths coming soon" (v2.25) */
#bpHp{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
/* Upgrade-tree path picker (v2.13): two path cards, then the Upgrade button confirms */
#bp.wide{width:344px}
#bp.wide #bpUp{flex:1.6}
#bpNext:empty,#bpNow:empty{display:none}
#bpPick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px}
#bpPick.hide{display:none}
#bpPick button{text-align:left;border:1px solid var(--line);border-radius:10px;padding:4px 7px;background:rgba(0,0,0,.25);font-size:11px;line-height:1.3;color:#cfd8e6;min-height:46px}
#bpPick button b{display:block;font-size:12px;color:var(--text)}
#bpPick button em{font-style:normal;color:var(--muted);margin-right:4px}
#bpPick button.on{border-color:#fff;box-shadow:inset 0 0 0 2px var(--blue);background:rgba(57,200,255,.08)}
#info{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);width:min(420px,calc(100vw - 2 * (env(safe-area-inset-right,0px) + 70px)));background:rgba(10,17,33,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:9px 12px 10px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#info.hide{display:none}
/* Extinction Event warning: under the top bar, takes no taps; toasts move down while it shows */
#ext{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 50px);left:50%;transform:translateX(-50%);padding:5px 14px;border-radius:10px;background:rgba(120,14,8,.9);border:1px solid #ff6a4d;color:#fff;font-weight:800;font-size:13px;letter-spacing:.3px;white-space:nowrap;pointer-events:none}
#ext.hide{display:none}
/* Overdrive (v2.32, Salvage Yard T3): an amber pill with a timer, top left under the top bar; taps pass through */
#od{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 50px);left:calc(env(safe-area-inset-left,0px) + 6px);display:flex;align-items:center;gap:5px;padding:3px 9px 3px 5px;border-radius:12px;background:rgba(40,22,6,.88);border:1px solid #ffaa3c;color:#ffd59a;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none}
#od.hide{display:none} #od svg{width:16px;height:16px;flex:none} #od span{font-variant-numeric:tabular-nums;color:#fff;min-width:22px}
.ext-on #toasts{top:calc(env(safe-area-inset-top,0px) + 84px)}
.info-open #bp{visibility:hidden} /* the building panel waits behind the info panel instead of overlapping it */
/* Commander abilities: a column on the right edge of the battlefield, clear of the top bar, the cards and both panels */
#abil{position:fixed;z-index:2;right:calc(env(safe-area-inset-right,0px) + 6px);top:calc(env(safe-area-inset-top,0px) + 50px);display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#abil.hide,#aim.hide{display:none}
.ab{position:relative;width:50px;height:50px;border-radius:50%;border:2px solid rgba(120,150,200,.45);background:rgba(14,22,40,.86);padding:0;overflow:hidden;-webkit-touch-callout:none;user-select:none}
.ab svg{position:relative;width:22px;height:22px;display:block;margin:5px auto 0;pointer-events:none}
.ab small{position:relative;display:block;font-size:9.5px;line-height:11px;font-weight:700;color:#d6e4ff;font-variant-numeric:tabular-nums;pointer-events:none;white-space:nowrap}
.ab small .e{color:#7dffb0} .ab small .no{color:var(--bad)}
.ab .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.62) calc(var(--p,0) * 1turn),transparent 0);pointer-events:none}
.ab.ready{border-color:var(--ac)} .ab.cool svg,.ab.poor svg,.ab.lock svg,.ab.wait svg{opacity:.4}
.ab.on{border-color:#fff;box-shadow:0 0 0 3px var(--ac)}
.ab.src{border-color:var(--ac);border-style:dashed} /* the ability that started the shared cooldown */
.ab.shake{animation:shake .3s}
#aim{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);display:flex;align-items:center;gap:0;padding:6px 6px 6px 12px;border-radius:12px;background:rgba(12,18,34,.92);border:1px solid var(--ac);color:#e6eefc;font-size:13px;white-space:nowrap;pointer-events:auto}
#aim b{color:#fff} #aimX{margin-left:10px;height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.1);font-weight:700}
@media (max-height:380px){#abil{gap:5px}.ab{width:46px;height:46px}.ab svg{width:20px;height:20px;margin-top:4px}}
#info .ih{display:flex;align-items:center;gap:8px}
#info .ih b{font-size:14.5px}
#info .ih small{color:var(--muted)}
#infoX{margin-left:auto;width:30px;height:26px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.25);font-size:15px;line-height:1}
.istats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px 10px;margin-top:6px}
.istats div{display:flex;flex-direction:column}
.istats small{color:var(--muted);font-size:10.5px}
.istats b{font-size:13px;font-variant-numeric:tabular-nums}
.irow{margin-top:5px;line-height:1.3}
.irow em{font-style:normal;color:var(--muted)}
#panel{flex:0 0 auto;height:78px;margin-bottom:3px;display:flex;background:var(--glass);border:1px solid var(--line);border-radius:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow:hidden}
.tabs{display:grid;grid-template-columns:62px 52px;grid-template-rows:1fr 1fr;gap:4px;padding:5px 0 5px 5px;flex:0 0 auto}
.tabs [data-tab="army"]{grid-column:2;grid-row:1 / span 2} /* v2.12: Build and Train stacked, Army beside them: the tray keeps its height */
.tabs button{flex:1;border:1px solid var(--line);background:rgba(0,0,0,.25);border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--panel3);color:var(--text);border-color:rgba(57,200,255,.6)}
#cards{flex:1;display:flex;gap:5px;padding:5px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x}
#cards::-webkit-scrollbar{display:none}
/* Army tab (v2.12): owned groups and types to select (scrolls), the order buttons always in view */
#cards.army{overflow:hidden}
.asel{flex:1;min-width:0;display:flex;gap:5px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x;-webkit-overflow-scrolling:touch}
.asel::-webkit-scrollbar{display:none}
.aempty{align-self:center;color:var(--muted);font-size:12.5px;padding:0 8px;white-space:nowrap}
.chip{position:relative;flex:0 0 80px;height:100%;border-radius:10px;border:1px solid var(--line);background:linear-gradient(rgba(30,46,76,.9),rgba(15,24,43,.9));display:flex;flex-direction:column;align-items:center;padding:2px 3px 3px;overflow:hidden}
.chip.grp{border-color:rgba(57,200,255,.4);background:linear-gradient(rgba(28,58,86,.9),rgba(14,28,48,.9))}
.chip.on{border-color:#fff;box-shadow:inset 0 0 0 2px var(--blue)}
.chip .ic{width:52px;height:30px;display:block;pointer-events:none}
.chip .nm{font-size:11.5px;font-weight:800;white-space:nowrap;pointer-events:none}
.chip .od{font-size:10px;color:var(--muted);white-space:nowrap;pointer-events:none}
.chip .od.set{color:#ffd34d}
.chip .cnt{position:absolute;top:3px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--blue);color:#001522;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;pointer-events:none}
.acmd{flex:0 0 auto;display:grid;grid-template-columns:64px 64px;grid-template-rows:1fr 1fr;gap:4px}
.acmd button{border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.3);font-weight:800;font-size:12.5px;color:var(--text)}
.acmd button.on{background:var(--panel3);border-color:rgba(57,200,255,.7)}
.acmd [data-o="attack"]{color:#ffb0b0} .acmd [data-o="retreat"]{color:#ffe08a} .acmd [data-o="move"]{color:#9fe6ff}
.card{position:relative;flex:0 0 92px;height:100%;border-radius:10px;border:1px solid var(--line);background:linear-gradient(rgba(30,46,76,.9),rgba(15,24,43,.9));display:flex;flex-direction:column;align-items:center;padding:2px 4px 6px;overflow:hidden;transition:transform .08s}
.card:active{transform:scale(.94)}
.card .ic{width:56px;height:32px;display:block;pointer-events:none}
.card .nm{font-size:11.5px;font-weight:700;white-space:nowrap;pointer-events:none}
.card .cost{font-size:10.5px;display:flex;gap:6px;align-items:center;margin-top:1px;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none}
.cost .no{color:var(--bad)}
.card .cost .lock{color:var(--muted);white-space:normal;text-align:center;line-height:1.1;font-size:10px}
.card .badge{position:absolute;top:3px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--blue);color:#001522;font-size:10.5px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 5px}
.card .badge.show{display:flex}
.card .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06)}
.card .bar i{display:block;height:100%;width:0;background:var(--blue)}
.card .path{position:absolute;left:4px;top:3px;font-size:9px;font-weight:800;letter-spacing:.04em;color:#ffd34d;pointer-events:none}
.card .path.pr:empty{display:none}
.trainHint{align-self:center;padding:0 14px;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap} /* empty Train tab (v2.16) */
.card.locked{opacity:.5}
.card.poor .nm{color:var(--muted)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.dot{display:inline-block;width:7px;height:7px;margin-right:3px}
.dot.c{background:var(--credit);transform:rotate(45deg) scale(.85)}
.dot.e{background:var(--energy);border-radius:50%}
.dot.p{background:var(--pop);border-radius:50%}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,6,14,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:10;padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 16px)}
#ov.hide{display:none}
#title{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:#05070d url('assets/title-screen.jpg') center/cover no-repeat;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;transition:opacity .35s}
#title.out{opacity:0;pointer-events:none}
#title h1{position:absolute;top:calc(env(safe-area-inset-top,0px) + 1.5vh);left:calc(env(safe-area-inset-left,0px) + 3vw);margin:0;font-size:clamp(20px,6vmin,44px);line-height:1;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.95),0 0 28px rgba(255,60,40,.5)}
#title h1 span{color:#ff5a3c}
@media (orientation:portrait){#title{background-position:82% center}#title h1{top:calc(env(safe-area-inset-top,0px) + 3vh);left:0;right:0;text-align:center;font-size:clamp(30px,11vw,56px);line-height:.95}#title h1 span{display:block}}
#title b{font-size:clamp(18px,4.4vmin,30px);font-weight:900;letter-spacing:.22em;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.9),0 0 22px rgba(255,80,60,.55);animation:tapPulse 2.4s ease-in-out infinite}
@keyframes tapPulse{0%,100%{opacity:1}50%{opacity:.25}}
.box{position:relative;width:min(620px,100%);max-height:100%;overflow:auto;background:linear-gradient(#111c33,#0a1222);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.box h1{margin:0;font-size:28px;line-height:1.05;font-weight:900;letter-spacing:.02em;color:var(--text)}
.box h1 span{color:var(--blue)}
.box h1.win{color:var(--good)}
.box h1.lose{color:var(--bad)}
.box .kicker{margin:0 0 4px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.box .ver{position:absolute;top:10px;right:14px;margin:0;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.box p{margin:6px 0 0;color:var(--muted);font-size:13.5px;max-width:64ch}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.how div{background:rgba(30,46,76,.6);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--muted)}
.how b{display:block;color:var(--text);font-size:13px;margin-bottom:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.row .lbl{color:var(--muted);font-size:13px}
/* Match setup (v2.17): difficulty, your faction, opponent faction */
.setup{display:grid;grid-template-columns:auto auto;justify-content:start;align-items:center;gap:6px 10px;margin-top:10px}
.setup .lbl{color:var(--muted);font-size:13px}
.setup .seg button{height:30px}
.setup{grid-template-columns:auto auto minmax(0,1fr)}.box .setup p.fdesc{grid-column:3;grid-row:1/span 3;align-self:center;margin:0 0 0 6px;font-size:12px;line-height:1.35;color:var(--muted)} /* v2.30: the picked faction, beside the choices (no extra height) */
@media (max-height:440px){.box .how{display:none}.box:not(.rep){padding:12px 16px}.box h1{font-size:24px}.box p{margin-top:4px}.setup{margin-top:8px;gap:5px 10px}.setup .seg button{height:28px}.box:not(.rep) .row{margin-top:10px}.box:not(.rep) .big,.box:not(.rep) .ghost{height:42px}} /* phones in landscape: the setup fits without scrolling */
.big{height:48px;padding:0 26px;border-radius:12px;border:0;background:linear-gradient(#4fd3ff,#1b8fd0);color:#001522;font-weight:800;font-size:16px}

.box.rep{height:100%;display:flex;flex-direction:column;padding:10px 14px 0;overflow:hidden}
.rep .top{display:flex;align-items:center;gap:10px}
.rep .top h1{font-size:22px}

.rep .rtabs button{height:28px;font-size:12.5px;white-space:nowrap}

.rep .flav{color:var(--text);font-weight:700}

.rep .foot{display:flex;gap:8px;align-items:center;padding:7px 0 9px;border-top:1px solid var(--line);margin-top:2px}
.rep .foot .big,.rep .foot .ghost{height:38px;padding:0 14px;font-size:14px}
.rep .foot .seg button{height:28px;font-size:12px}
.rep table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.rep th{color:var(--muted);font-weight:700;text-align:left;padding:3px 6px 3px 0;white-space:nowrap;vertical-align:top}
.rep td{padding:3px 6px;color:var(--text);vertical-align:top} .rep td.e{color:#ffb0b0}
.rep tr+tr{border-top:1px solid rgba(120,150,200,.12)}
.rep .note{font-size:11.5px;color:var(--muted);margin:5px 0 0}
.rep .tl{list-style:none;margin:0;padding:0;font-size:12.5px}
.rep .tl li{display:flex;gap:8px;padding:4px 0;border-top:1px solid rgba(120,150,200,.12)}
.rep .tl b{min-width:42px;color:var(--blue);font-variant-numeric:tabular-nums}
.rep .tag{font-size:10.5px;padding:0 5px;border-radius:5px;background:rgba(255,255,255,.08);color:var(--muted);white-space:nowrap;align-self:flex-start}
.rep .les{margin:0 0 8px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;font-size:12.5px}
.rep .les div{margin-top:2px} .rep .les em{font-style:normal;font-weight:800;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-right:5px}
.rep .f{color:#9fe6ff} .rep .i{color:#ffd34d} .rep .r{color:#5dff8a}
.rep svg{display:block;width:100%;height:46px;margin:2px 0 2px}
.rep .tbar{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rep .tbar .ghost{height:30px;padding:0 10px;font-size:12.5px;border-radius:9px}
.rep .ok{color:var(--good);font-weight:800;font-size:12.5px}
.rep .tw{display:grid;grid-template-columns:46px 1fr 54px 1fr;font-size:12px;font-variant-numeric:tabular-nums}
.rep .tw>*{padding:2px 4px;border-bottom:1px solid rgba(120,150,200,.08)}
.rep .tw h4{margin:0;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.rep .tw .mh{color:#39c8ff;grid-column:span 2} .rep .tw .th{color:#ff6b6b;grid-column:span 2;border-left:1px solid var(--line);padding-left:8px}
.rep .tw b{font-weight:700} .rep .tw .tme{color:#39c8ff} .rep .tw .tthem{color:#ff6b6b;border-left:1px solid var(--line);padding-left:8px}
.rep .tw .me{color:#8fdcff} .rep .tw .them{color:#ff9a9a} .rep .tw .k{font-weight:700} .rep .tw .u{opacity:.75}
.rep .cpy{position:absolute;inset:44px 12px 56px;background:#0a1222;border:1px solid var(--blue);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
.rep .cpy p{margin:0;font-size:12px} .rep .cpy textarea{flex:1;width:100%;background:#050a14;color:#cfd8e6;border:1px solid var(--line);border-radius:8px;font:11px ui-monospace,Menlo,monospace;padding:6px;-webkit-user-select:text;user-select:text}
.rep .cpy .ghost{height:30px}
#rotate{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);text-align:center;padding:24px}

@keyframes rot{45%,80%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rotate{display:flex}}
@media (max-height:360px){#hud{height:38px}#panel{height:78px}.card{flex-basis:86px}.card .ic{height:28px}.how{display:none}}

/* Narrower screens drop the status word (the shield icon still shows it); narrow phones also use the compact top bar */
@media (max-width:900px){.hqr small{display:none}.hqr .hb{width:28px}}
@media (max-width:820px){.res small{display:none}#hud{gap:7px}.seg button{padding:0 7px}.hqr{flex-direction:column;gap:3px}.hqr small{display:none}.hqr .hb{width:16px;height:3px}}
@media (max-width:700px){#hud{gap:5px}.hqr{margin:0 -2px}#mm{min-width:52px}}
@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none}.shake{animation:none}#cd b.pop{animation:none}}

<script>
'use strict';
const GAME_NAME = 'Extinction Event', VERSION = '2.32'; // bump VERSION with every change
/* =====================================================================
   SIM — rules, economy, combat and AI. Positions live on a flat plane:
   u runs left to right along the battle lane, v is depth (back → front).
   Bases are a Colony-style diamond of pads; the HQ sits on the back pad.
   ===================================================================== */
const L = 1700, HQ_U = 220, TILE = 70;
const SLOT_COUNT = 8, POP_MAX = 80, LANE_V = 115, DV_W = 0.4, US = 1.3, BS = 0.75;
const IX = 0.866, IY = 0.5, DY = 0.5;
const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
// Side-scrolling view: u is screen x, depth v is foreshortened, z is height
const P = (u, v, z = 0) => ({ x: u, y: v * DY - z });

// Difficulty is decision quality only: every side has the same resources, income and rules.
//  delay: seconds between decisions   smart: chance of picking the best unit (else a weighted guess)
//  wave: army size it waits for before a big attack   maxTier / upStart: highest upgrade it uses, and from when
//  calmSave: while threatened, saves for counters (Tanks against infantry) instead of trickling cheap units
//  calmTech: while threatened, holds upgrades and new tech and gets a War Factory first
//  eco: turns spare energy into credits (more Refineries)
//  turret: chance (per match) that it recognises an infantry rush in time and answers with a Turret
//  nodes: fights for its near field node with its whole army
//  refineries: Refineries in its build plan   trainPer: units it queues per decision
//  fieldEdge: how much stronger than the enemy army it knows of it must be to push out for the field nodes
//  armyCap: share of its army size limit it actually fills (an under-filled cap grows back to full from 12 to 20 minutes)
const DIFF = {
  easy:   { delay: 2.5, wave: 0.8, label: 'Easy',   maxTier: 2, upStart: 40, smart: 0.2,  calmSave: false, calmTech: false, eco: false, turret: 0, nodes: false, refineries: 1, trainPer: 1, fieldEdge: 1.5, fieldMin: 600, armyCap: 0.6 },
  normal: { delay: 1.0, wave: 1.0, label: 'Normal', maxTier: 3, upStart: 90, smart: 0.65, calmSave: true,  calmTech: false, eco: true,  turret: 0.5,  nodes: false, refineries: 2, trainPer: 2, fieldEdge: 0.9, fieldMin: 300, armyCap: 1 },
  hard:   { delay: 1.0, wave: 1.0, label: 'Hard',   maxTier: 3, upStart: 90, smart: 0.65, calmSave: true,  calmTech: true,  eco: true,  turret: 1,  nodes: true,  refineries: 2, trainPer: 2, fieldEdge: 0.9, fieldMin: 300, armyCap: 1 },
};

// Seconds of "GET READY" at match start. The world is frozen and the clock (g.t) starts at GO.
const COUNTDOWN = 3;

// Factions (v2.16): each side plays one. Both use the same building roles (hq, refinery, reactor, habitat, barracks,
// turret, factory, techlab); a faction has its own names, stats, art and units for them (BDEFS, UDEF.fac).
// abilities: has commander abilities; trees: its production buildings pick upgrade paths (TREES).
const FACTIONS = {
  lastfist: { name: 'Last Fist', abilities: true, trees: true, abil: ['shield', 'strike', 'repair'] },
  bloomhost: { name: 'Bloomhost', abilities: true, trees: true, abil: ['frenzy', 'brood', 'corrosive'] }, // trees: Larva Pit and Evolution Chamber (v2.19), Bloomspire (v2.21); abilities v2.20
  // Axiarchs (v2.25 framework, docs/AXIARCHS.md): trees on the Genesis Gate and Architectum
  // (v2.27), the Celestial Array v2.29; commander abilities v2.28
  axiarchs: { name: 'Axiarchs', abilities: true, trees: true, abil: ['mwarp', 'overcharge', 'beam'] },
}, DEFAULT_FACTION = 'lastfist', FACTION_KEYS = Object.keys(FACTIONS);
const factionName = k => (FACTIONS[k] || FACTIONS[DEFAULT_FACTION]).name;
// One line per faction for the setup menu (v2.30). Salvage's numbers come from SALVAGE, defined further down (read at call time).
const factionDesc = k => k === 'random' ? 'A random faction, revealed when the match starts.' : {
  lastfist: () => SALVAGE.pct > 0 ? `Last Fist: combined arms. Salvage: any unit destroyed near your forces returns ${Math.round(SALVAGE.pct * 100)}% of its credit cost.` : 'Last Fist: adaptable combined arms, the easiest to learn.',
  bloomhost: () => 'Bloomhost: swarms that spread creep; on creep they move faster and heal.',
  axiarchs: () => 'Axiarchs: costly elite units with shields that recharge in their power field.',
}[facOf(k)]();
const facOf = k => FACTIONS[k] ? k : DEFAULT_FACTION;

const HPMUL = [1, 1, 1.25, 1.5];
const BDEF = {
  hq: { name: 'Command HQ', cost: { c: 0, e: 0 }, hp: 2800, half: 44, h: 104, time: 1,
    pop: [0, 12, 12, 12], inc: [null, { c: 3, e: 1 }, { c: 3, e: 1 }, { c: 3, e: 1 }], hpMul: [1, 1, 1.3, 1.6],
    gun: [null, { weapon: 'hqgun', dmg: 32, cd: 1.1, range: 390, hitsAir: true },
                { weapon: 'hqgun', dmg: 42, cd: 1.0, range: 430, hitsAir: true },
                { weapon: 'hqgun', dmg: 55, cd: 0.9, range: 470, hitsAir: true }],
    up: [null, null, { c: 300, e: 100, time: 20 }, { c: 500, e: 250, time: 28 }],
    tiers: [null, 'Turret 32 damage, 390 range, 2,800 HP', 'Turret 42 damage, 430 range, 3,640 HP', 'Turret 55 damage, 470 range, 4,480 HP'] },
  refinery: { name: 'Refinery', cost: { c: 150, e: 0 }, hp: 520, half: 32, h: 62, time: 10,
    inc: [null, { c: 4, e: 0 }, { c: 6, e: 0 }, { c: 9, e: 0 }],
    up: [null, null, { c: 120, e: 20, time: 12 }, { c: 200, e: 60, time: 18 }],
    tiers: [null, '+4 credits/s', '+6 credits/s', '+9 credits/s'] },
  reactor: { name: 'Reactor', cost: { c: 125, e: 0 }, hp: 460, half: 30, h: 60, time: 12,
    inc: [null, { c: 0, e: 2 }, { c: 0, e: 3 }, { c: 0, e: 4.5 }],
    up: [null, null, { c: 100, e: 30, time: 12 }, { c: 180, e: 80, time: 18 }],
    tiers: [null, '+2 energy/s', '+3 energy/s', '+4.5 energy/s'] },
  habitat: { name: 'Habitat', cost: { c: 100, e: 0 }, hp: 420, half: 32, h: 40, time: 8,
    pop: [0, 10, 16, 22],
    up: [null, null, { c: 100, e: 20, time: 10 }, { c: 160, e: 50, time: 14 }],
    tiers: [null, '+10 army size', '+16 army size', '+22 army size'] },
  barracks: { name: 'Barracks', cost: { c: 150, e: 0 }, hp: 640, half: 32, h: 56, time: 14,
    up: [null, null, { c: 150, e: 50, time: 14 }, { c: 250, e: 120, time: 20 }],
    tiers: [null, 'Trains Riflemen', 'Unlocks Heavy troopers', 'Unlocks Snipers'] },
  factory: { name: 'War Factory', cost: { c: 300, e: 50 }, hp: 820, half: 36, h: 50, time: 20, req: 'barracks',
    up: [null, null, { c: 200, e: 100, time: 18 }, { c: 350, e: 200, time: 24 }],
    tiers: [null, 'Builds Tanks', 'Unlocks Artillery', 'Unlocks Titans'] },
  techlab: { name: 'Tech Lab', cost: { c: 350, e: 150 }, hp: 700, half: 30, h: 96, time: 26, req: 'barracks', // v2.16: a Barracks is enough
    up: [null, null, { c: 250, e: 150, time: 20 }, { c: 400, e: 300, time: 28 }],
    tiers: [null, 'Builds Gunships', 'Unlocks Interceptors', 'Nanoweave: your units and defenses deal 20% more damage and take 15% less'] },
  turret: { name: 'Turret', cost: { c: 200, e: 50 }, hp: 900, half: 26, h: 46, time: 12,
    gun: [null, { weapon: 'gatling', dmg: 12, cd: 0.45, range: 250, hitsAir: true },
                { weapon: 'gatling', dmg: 17, cd: 0.4, range: 280, hitsAir: true },
                { weapon: 'gatling', dmg: 22, cd: 0.35, range: 310, hitsAir: true }],
    up: [null, null, { c: 150, e: 60, time: 12 }, { c: 250, e: 120, time: 16 }],
    tiers: [null, 'Gun 27 damage/s, 250 range, hits air', 'Gun 42 damage/s, 280 range, hits air', 'Gun 63 damage/s, 310 range, hits air'] },
};
// Signature buildings (v2.32, docs/SIGNATURE_BUILDINGS.md): two roles, sigA and sigB, at most one of each per side at a time.
// Cost, build time, HP and upgrade costs are the faction's light production building's (Last Fist: the Barracks); no tree,
// no supply. Last Fist: the Salvage Yard (A) raises Salvage (YARD), the Fortification Depot (B) puts a bunker on every field
// node it holds (BUNKER). A faction without these roles yet (Bloomhost until v2.33, Axiarchs until v2.34) can't build them.
const sigDef = (base, x) => Object.assign({ cost: base.cost, hp: base.hp, half: base.half, time: base.time, up: base.up, sig: true }, x);
BDEF.sigA = sigDef(BDEF.barracks, { name: 'Salvage Yard', h: 46,
  tiers: [null, 'Salvage returns 20% of a unit\'s credit cost (base 10%)', 'Salvage cap doubled (400 a minute); salvage also returns half as much energy', 'Overdrive: salvage over the cap speeds your production +25% for 20 s'] });
BDEF.sigB = sigDef(BDEF.barracks, { name: 'Fortification Depot', h: 48,
  tiers: [null, 'A bunker on every field node you hold (ground only)', 'Bunkers heal your Barracks units in range, 2% of HP per second', 'Bunker guns deal double damage and hit aircraft'] });
// The node bunker: the Turret's code at half a T1 Turret's HP and damage, ground only until the Depot's T3. Never built by
// hand: the Depot places one on each held node (no pad, no supply, no cost) and its tier follows the Depot's.
BDEF.bunker = { name: 'Node Bunker', cost: { c: 0, e: 0 }, hp: BDEF.turret.hp / 2, half: 14, h: 26, time: 1, noPad: true, up: [null, null, null, null],

  }
  // No Habitat and no free pad: the army is stuck at the HQ's 12. Sell a spare Reactor or extra Refinery to make room.
  if (!freePad && countB(g, s, 'habitat') === 0 && cap < POP_MAX && D.eco) {
    const spare = alive(g, s, 'reactor').find(b => side.res.e > ENERGY_PLENTY) || (countB(g, s, 'refinery') > 2 && alive(g, s, 'refinery')[0]);

  }
  // Credits piling up with no energy and no free pad: trade an extra Refinery for a Reactor
  if (!freePad && D.eco && side.res.e < 120 && side.res.c > 1500 && countB(g, s, 'refinery') > 2 && !constructing.length) {
    trySell(g, s, alive(g, s, 'refinery')[0]); want = 'reactor';
  }
  if (!want && D === DIFF.hard && !g.forcePath && freePad && !constructing.length && income(g, s).c >= 25 && aiArmorShare(theirs) > 0.35) {
    const bar = alive(g, s, 'barracks');
    if (bar.length && bar.length < 2 && bar.every(b => aiPathFrom(side.faction, 'barracks', b.path || b.upPath) === 'B')) want = 'barracks'; // then its T2 upgrade takes Specialists
  }
  if (want && side.slots.some(x => !x) && constructing.length < 2) {
    const d = bdS(g, s, want);
    if (!d.req || hasBuilt(g, s, d.req)) {
      const r = tryBuild(g, s, want, wantPad);

    }
  }

  // The Extinction Event: keep the HQ standing first (paid Repair is all that works in the storm)
  if (g.t >= EXT.start && side.hq.hp > 0 && side.hq.hp < side.hq.maxHp * 0.9 && !(side.hq.repair > 0) && side.res.c > 150) tryRepair(g, s, side.hq);
  // Repair a badly damaged building when the coast is clear
  if (!threat && side.res.c > 600) {
    const hurt = g.ents.find(b => b.kind === 'b' && b.side === s && b.type !== 'bunker' && b.built && b.hp > 0 && !(b.repair > 0) && b.hp < b.maxHp * 0.6);
    if (hurt) tryRepair(g, s, hurt);
  }

  // 2) Upgrades; a calm AI holds them while threatened; Reactor upgrades wait until energy runs short
  const upgrading = g.ents.some(b => b.kind === 'b' && b.side === s && b.upgrading && b.hp > 0);
  const floating = side.res.c > 700 && side.res.e > 200;
  const buildDone = !want || !freePad || constructing.length > 0;
  if (g.t >= D.upStart + P.upShift - (ecoMood ? 30 : 0) && !upgrading && (buildDone || floating) && (!(calm || defend) || floating) && !(D.maxTier < 3 && Math.random() < 0.5)) {
    const energyShort = side.res.e < 120 && side.res.c > 800;
    for (const [type, tier] of [...(energyShort ? [['reactor', 2], ['reactor', 3]] : []), ...P.upgFirst, ...AI_UPG]) {
      if (tier > D.maxTier) continue;
      if (type === 'reactor' && side.res.e > ENERGY_PLENTY) continue;
      if (prodLocked(side.faction, type)) continue; // no paths yet (Axiarch production, v2.25)
      const b = alive(g, s, type).find(x => x.built && x.tier < tier);
      if (!b) continue;
      const r = tryUpgrade(g, s, b, b.tier === 1 && TREES[type] ? aiPickPath(g, s, b, P, theirs) : undefined);
      if (r.ok && log.firstUpgrade === null) log.firstUpgrade = g.t;
      if (!r.ok && !floating) { const up = bdOf(b).up[b.tier + 1]; reserve.c = Math.max(reserve.c, up.c * 0.8); reserve.e = Math.max(reserve.e, up.e * 0.8); }
      break;
    }
  }

  // The Aggressor's answer to a fortified enemy: keep enough back for an Orbital Strike on its known defences
  if (P.kind === 'aggressor' && D !== DIFF.easy && !threat && abilUnlocked(g, s, ABIL.strike) && side.ab.strike - g.t < 15 && aiFortified(g, s) && (side.stance === 'attack' || side.ab.strike > g.t)) {
    reserve.c = Math.max(reserve.c, ABIL.strike.cost.c); reserve.e = Math.max(reserve.e, ABIL.strike.cost.e);
  }
  // 3) Army: counter what the opponent fields, bring siege guns against a turtle
  const types = UNIT_ORDER.filter(t => canTrain(g, s, t));
  const turtle = theirs.length > 2 && theirs.filter(u => Math.abs(u.u - hqU(opp)) < 560).length / theirs.length > 0.6;
  if (types.length) {
    const comp = { light: 0, heavy: 0, vehicle: 0, air: 0 };
    let tot = 0;
    // Interceptors can't touch the ground, so only ground-attacking aircraft count as an air threat
    // (counting them made both sides race to build Interceptors against each other's Interceptors)
    for (const u of theirs) { const d = UDEF[u.type], v = (d.cost.c + d.cost.e) * u.w; comp[d.armor === 'air' && d.hitsGround === false ? 'harmless' : d.armor] = (comp[d.armor === 'air' && d.hitsGround === false ? 'harmless' : d.armor] || 0) + v; tot += v; }
    if (tot > 0) for (const k in comp) comp[k] /= tot;
    const antiAir = theirs.length ? theirs.filter(u => UDEF[u.type].hitsAir).length / theirs.length : 0.5;
    const airV = theirs.reduce((a, u) => a + (UDEF[u.type].air && UDEF[u.type].hitsGround !== false ? (UDEF[u.type].cost.c + UDEF[u.type].cost.e) * u.w : 0), 0);
    const myInterceptV = mine.reduce((a, u) => a + (u.type === 'interceptor' ? UDEF.interceptor.cost.c + UDEF.interceptor.cost.e : 0), 0);
    const nArt = mine.filter(u => AI_ART.includes(u.type)).length;
    const nFront = mine.filter(u => !UDEF[u.type].air && !AI_ART.includes(u.type)).length;
    const nInf = mine.filter(u => GROUP_OF[u.type] === 'inf').length, nMed = mine.filter(u => u.type === 'medic').length, nDrone = mine.filter(u => u.type === 'drone').length;
    const sc = {
      rifle: 0.9 + comp.light * 0.6 + comp.air * 0.8 - comp.vehicle * 0.7 - comp.heavy * 0.5 - (types.length > 3 ? 0.4 : 0),
      heavy: 0.9 + comp.vehicle * 1.6 + comp.air * 1.6 + comp.heavy * 0.6,
      sniper: 0.8 + comp.light * 1.4 + comp.heavy * 1.0 - comp.vehicle * 1.0 - comp.air * 0.6,
      tank: 1.3 + comp.light * 1.2 + comp.heavy * 0.9 - comp.air * 0.9,
      artillery: (nFront >= 3 && nArt < Math.max(2, nFront / 2.5)) ? 1.1 + comp.light * 0.5 + (turtle ? 0.8 : 0) + (oppTier - 1) * 0.3 : 0.1,
      titan: 1.2 + comp.vehicle * 0.8 + comp.heavy * 0.8 + comp.light * 0.4 - comp.air * 1.2 + (turtle ? 0.4 : 0),
      aircraft: 1.2 + comp.vehicle * 1.2 + comp.heavy * 0.4 - comp.air * 0.3 + (antiAir < 0.45 ? 0.9 : 0),

      interceptor: comp.air > 0.12 && myInterceptV < airV * 1.2 ? 1 + comp.air * 3.2 : 0.05,
      flame: 1.3 + comp.light * 2.2 + comp.heavy * 0.6 - comp.vehicle * 1.0 - comp.air * 0.8, // simple scoring for now (v2.14)
      hydra: 1.4 + comp.air * 2.0 + comp.light * 0.7 - comp.vehicle * 0.8,
      leviathan: 1.7 + comp.vehicle * 0.5 + (turtle ? 0.8 : 0) - antiAir * 1.2, // simple scoring for now (v2.15)
      medic: nInf >= 6 && nMed < nInf / 8 ? 0.9 + nInf / Math.max(1, mine.length) * 1.2 : 0.05,
      drone: nDrone < 1 ? 1.0 : 0.05,
      // Bloomhost (v2.17): scored like their Last Fist counterparts; Skitterlings can't hit aircraft
      skitterling: 0.9 + comp.light * 0.5 - comp.vehicle * 0.6 - comp.heavy * 0.3 - comp.air * 0.4 - (types.length > 2 ? 0.3 : 0),
      bulwark: 1.3 + comp.light * 1.0 + comp.heavy * 0.7 - comp.air * 0.9,
      razorwing: 1.2 + comp.vehicle * 1.0 + comp.light * 0.4 + comp.air * 0.6 + (antiAir < 0.45 ? 0.9 : 0), // v2.19: it hits aircraft too

      leaper: 1.0 + comp.light * 0.8 - comp.vehicle * 0.6 - comp.air * 0.4,
      ravager: 1.2 + comp.light * 1.2 + comp.heavy * 0.3 - comp.vehicle * 0.6 - comp.air * 0.5,
      spitter: 1.0 + comp.air * 2.0 + comp.heavy * 0.5 + comp.vehicle * 0.3,
      bilecaster: 1.1 + comp.light * 1.4 + comp.heavy * 0.6 - comp.air * 0.6,
      bilelobber: (nFront >= 3 && nArt < Math.max(2, nFront / 2.5)) ? 1.1 + comp.light * 0.5 + (turtle ? 0.8 : 0) + (oppTier - 1) * 0.3 : 0.1,
      ruinmaw: 1.2 + comp.vehicle * 0.8 + comp.heavy * 0.8 + comp.light * 0.4 - comp.air * 1.2 + (turtle ? 0.4 : 0),
      thornback: 1.3 + comp.light * 1.0 + comp.heavy * 0.6 - comp.air * 0.8,
      dreadthorn: 1.4 + comp.light * 1.4 + comp.heavy * 0.6 - comp.air * 0.9,
      // Bloomspire tree (v2.21): simple scores; none of the four hits aircraft
      needlewing: 1.0 + comp.light * 0.6 + comp.vehicle * 0.4 - comp.air * 0.6 + (antiAir < 0.45 ? 0.7 : 0),
      cloudwing: 1.3 + comp.light * 0.8 + comp.vehicle * 0.4 - comp.air * 0.6 + (antiAir < 0.45 ? 0.8 : 0),
      broodtyrant: 1.5 + comp.vehicle * 0.6 + (turtle ? 0.8 : 0) - antiAir * 1.0 - comp.air * 0.5,
      worldrender: 1.7 + comp.vehicle * 0.5 + (turtle ? 0.8 : 0) - antiAir * 1.2 - comp.air * 0.5,
      // Axiarch base units (v2.25): scored like their Last Fist counterparts
      shardling: 0.9 + comp.light * 0.5 - comp.vehicle * 0.5 - comp.air * 0.4 - (types.length > 2 ? 0.3 : 0),
      bastion: 1.3 + comp.light * 1.0 + comp.heavy * 0.7 - comp.air * 0.9,
      wraithwing: 1.2 + comp.vehicle * 1.0 + comp.light * 0.4 + comp.air * 0.6 + (antiAir < 0.45 ? 0.9 : 0),
      // Axiarch tree units (v2.27): simple scores in the style of their Last Fist counterparts
      riftstalker: 1.0 + comp.light * 0.9 - comp.vehicle * 0.6 - comp.air * 0.4,
      parallax: 1.2 + comp.light * 1.1 + comp.heavy * 0.4 - comp.vehicle * 0.5 - comp.air * 0.5,
      lancer: 1.0 + comp.air * 2.0 + comp.heavy * 0.5 + comp.vehicle * 0.3,
      marksman: 0.8 + comp.light * 1.4 + comp.heavy * 1.0 - comp.vehicle * 1.0 - comp.air * 0.6,
      riftmortar: (nFront >= 3 && nArt < Math.max(2, nFront / 2.5)) ? 1.1 + comp.light * 0.5 + (turtle ? 0.8 : 0) + (oppTier - 1) * 0.3 : 0.1,
      worldbreaker: 1.2 + comp.vehicle * 0.8 + comp.heavy * 0.8 + comp.light * 0.4 - comp.air * 1.2 + (turtle ? 0.4 : 0),
      gravemantle: 1.3 + comp.light * 1.6 + comp.heavy * 0.6 - comp.vehicle * 0.6 - comp.air * 0.8,
      eventide: 1.4 + comp.light * 1.2 + comp.heavy * 0.6 - comp.air * 0.9,
      // Celestial Array tree (v2.29): simple scores in the style of the Bloomspire's
      prismwing: 1.0 + comp.light * 0.6 + comp.vehicle * 0.4 - comp.air * 0.6 + (antiAir < 0.45 ? 0.7 : 0),
      shardstorm: 1.2 + comp.air * 1.4 + comp.light * 0.8 + (antiAir < 0.45 ? 0.6 : 0),
      voidcarrier: 1.5 + comp.vehicle * 0.6 + (turtle ? 0.8 : 0) - antiAir * 1.0 - comp.air * 0.5,
      sovereign: 1.7 + comp.vehicle * 0.5 + (turtle ? 0.8 : 0) - antiAir * 1.2 - comp.air * 0.5,
    };
    if (!threat) for (const t of types) { const b = P.bias[t] || P.bias[AI_TWIN[t]]; if (b && sc[t] > 0) sc[t] *= b; } // the personality's taste in units (threats are answered on merit)
    // Bloomspire path units (v2.21, minimal): one the AI has never trained goes to the top once, so it saves for it (its

    if (facOf(side.faction) === 'bloomhost') { const best = Math.max(...types.map(t => sc[t])); for (const t of types) if (UNIT_PATH[t] && UNIT_PATH[t].b === 'techlab' && !log.trained[t]) sc[t] = best + 0.1; }
    // Axiarchs (v2.28): the same rule on every production path (Genesis Gate, Architectum, and the Celestial Array's once it has one)
    if (facOf(side.faction) === 'axiarchs') { const best = Math.max(...types.map(t => sc[t])); for (const t of types) if (UNIT_PATH[t] && !log.trained[t]) sc[t] = best + 0.1; }
    const fits = t => used + UDEF[t].pop <= cap * fillNow && freeProducer(g, s, t);
    const top = types.filter(fits).sort((a, b) => sc[b] - sc[a])[0];

    const mustSpend = defend || (saving ? danger && !(lightThreat && hasBuilt(g, s, 'factory')) : threat); // vs infantry, Tanks beat trickled Riflemen
    for (let k = 0; k < D.trainPer; k++) {
      const cand = types.filter(t => { const d = UDEF[t]; return fits(t) && side.res.c - d.cost.c >= reserve.c && side.res.e - d.cost.e >= reserve.e; });
      if (!cand.length) break;
      if (top && !cand.includes(top) && !mustSpend && (saving || Math.random() < 0.6)) break;
      let pick;
      if (Math.random() < D.smart) pick = cand.slice().sort((a, b) => sc[b] - sc[a])[0];
      else {
        let sum = 0;
        const w = cand.map(t => { const v = Math.max(0.05, sc[t]) ** 2; sum += v; return v; });
        let r = Math.random() * sum; pick = cand[0];
        for (let i = 0; i < cand.length; i++) { r -= w[i]; if (r <= 0) { pick = cand[i]; break; } }
      }
      if (!tryTrain(g, s, pick).ok) break;
      log.trained[pick] = (log.trained[pick] || 0) + 1;
      used = popUsed(g, s);
    }
  }

  // 4) Strategy: hold the near node, take the field, siege just outside the enemy guns, or go all in
  const hqGun = BDEF.hq.gun[oppTier], hqVal = knownDefense(g, s);
  const rich = side.res.c > 2500;
  const nSiege = mine.filter(u => AI_SIEGE.includes(u.type)).length;
  const ae = P.attackEdge * (ecoMood ? 1.2 : 1); // how much of an edge this personality wants before a base attack
  const wave = Math.min(3600, 400 + g.t * 4) * D.wave * P.wave * (ecoMood ? 1.3 : 1);
  const full = used >= cap * fill - 2, since = g.t - side.stanceAt; // full by its own army limit

  const late = g.t > 1080; // after 18 minutes, stop waiting for a perfect edge
  const bold = myV >= attackBar(g, s) || (full && (rich || side.res.c > 1000)) || late;
  const siegeLine = hqU(opp) - dir * (hqGun.range + 25), fieldLine = L / 2 + dir * 20;
  const myNode = g.nodes[s === 0 ? 0 : g.nodes.length - 1];
  // enemies camping on or near our node, as far as we know
  const atNode = theirs.filter(u => u.fresh && Math.abs(u.u - myNode.u) < NODE_R + 160);
  const nodeLost = myNode.owner === opp || atNode.length > 0;
  const failed = () => {
    if (!side.launchV) return;
    side.failV = side.launchV * FAIL_MARGIN; side.failT = g.t; side.launchV = 0;
    side.fails = (side.fails || 0) + 1;
    if (P.kind === 'aggressor' && side.fails >= 2) { side.moodUntil = g.t + rand(180, 240); side.fails = 0; } // rethink: economy first
  };
  const go = (pushTo, mode) => {
    const was = side.stance; side.stance = 'attack'; side.pushTo = pushTo; side.pushMode = mode; side.stanceAt = g.t;
    side.launchV = mode === 'all' || mode === 'siege' ? myV : 0;
    if (was === 'attack') return;
    // Trickster: some pushes are feints that pull back; two feints in a row and the next push is real
    let feint = 0;
    if (P.feint && (side.feintStreak || 0) < 2 && Math.random() < P.feint) { side.feintUntil = g.t + rand(8, 15); side.feintStreak = (side.feintStreak || 0) + 1; side.launchV = 0; log.feints++; feint = 1; }
    else { side.feintStreak = 0; log.attacks++; if (log.firstAttack === null) log.firstAttack = g.t; if (P.kind === 'trickster') P.wave = rand(0.8, 1.3); }
    ev(g, { type: 'aiAttack', side: s, mode }); lg(g, s, 'G', mode, feint);
  };
  // weak spots it can see: a field node the enemy holds with little around it, or an enemy that just spent its army on us
  const oppNode = g.nodes[1]; // the middle node (the enemy's own node sits under its HQ guns)
  const weakNode = P.opportunist && oppNode.owner === opp && myV >= 250 &&
    armyValue(theirs.filter(u => Math.abs(u.u - oppNode.u) < NODE_R + 200)) < myV * 0.5;
  const punish = P.opportunist && side.lastDanger !== undefined && g.t - side.lastDanger < 20 && !threat && myV >= 300 && myV >= thV * 1.2;
  // The Aggressor against a fortified base: if its Orbital Strike is only seconds away, wait for it rather than walk in head-on
  const strikeWait = side.ab.strike - g.t, holdForStrike = P.kind === 'aggressor' && D !== DIFF.easy && !threat && !late && strikeWait > 0 && strikeWait < 12 && aiFortified(g, s) && hasBuilt(g, s, 'factory');
  if (side.stance !== 'attack' && g.t >= EXT.warn && myV >= 200 && myV >= thV * 0.7) go(null, 'all'); // the storm is coming: everything in
  else if (side.stance !== 'attack' && holdForStrike) { /* wait */ }
  else if (side.stance !== 'attack') {
    if (bold && myV >= 300 && ((myV >= (thV + hqVal) * 1.35 * ae && myV >= wave * 0.6) || (full && myV > (thV + hqVal) * 1.05 * ae))) go(null, 'all');
    else if (bold && nSiege >= 2 && myV >= thV * 0.95 * ae && (myV >= wave * 0.7 || full)) go(siegeLine, 'siege');
    else if (bold && myV >= wave && myV > thV * 1.15 * ae) go(siegeLine, 'siege');
    else if (bold && rich && full && myV >= thV * 0.85) go(null, 'all'); // money in the bank refills the army, so commit
    else if ((g.t > P.deadline && myV >= 500 && myV >= thV * 0.9) || (late && myV >= 400 && myV >= thV * 0.8)) go(nSiege >= 2 ? siegeLine : null, nSiege >= 2 ? 'siege' : 'all'); // a Turtle must attack eventually; nobody sits forever
    else if (bold && punish) go(null, 'all'); // their army just broke against our base
    else if (D.nodes && nodeLost && myV >= 250 && myV >= armyValue(atNode) * 1.15) go(myNode.u, 'node'); // win back our node, all together
    else if (P.kind === 'aggressor' && lightThreat && myV < thV * 1.3) { /* an infantry rush at the door: hold the base until clearly stronger */ }
    else if (weakNode) go(fieldLine, 'field');
    else if (myV >= D.fieldMin && myV >= thV * D.fieldEdge * (threat ? Math.max(1, P.fieldEdge) : P.fieldEdge)) go(fieldLine, 'field'); // take and hold the field nodes
  } else if (side.feintUntil && g.t >= side.feintUntil) {
    side.feintUntil = 0; side.stance = 'retreat'; side.pushTo = null; side.pushMode = null; side.launchV = 0; side.stanceAt = g.t; // the feint pulls back
  } else if (since > 6 && myV < thV * (late ? 0.5 : 0.7)) {

  } else if (side.pushTo === null && since > 10 && thV < 200 && myV < hqVal * 1.2 && !rich) {

    side.stance = 'retreat'; side.pushMode = null; side.stanceAt = g.t; // too few to crack the base defenses: regroup instead of trickling in
  } else if (side.pushMode === 'field' || side.pushMode === 'node') {

    else if (bold && myV >= 300 && ((myV >= (thV + hqVal) * 1.35 && myV >= wave * 0.6) || (full && myV > (thV + hqVal) * 1.05))) { side.pushTo = null; side.pushMode = 'all'; side.launchV = myV; side.stanceAt = g.t; }
    else if (side.pushMode === 'node' && !nodeLost && myNode.owner === s && myV >= 300 && myV >= thV * 0.9) { side.pushTo = fieldLine; side.pushMode = 'field'; side.stanceAt = g.t; }
  } else if (side.pushTo !== null && bold && (myV > (thV + hqVal) * 1.3 || (since > 50 && myV > thV * 1.1))) {
    side.pushTo = null; side.pushMode = 'all'; side.stanceAt = g.t;

}
// Spotters: siege guns can't fire at what their side can't see, so while sieging, one unit walks up until
// its sight reaches the front of the enemy base (as far as this side knows where that is). Seeing the base
// means entering its HQ's range, so sturdy units go first; a fallen spotter is replaced on the next tick.
const SPOTTER_PREF = ['drone', 'titan', 'tank', 'heavy', 'aircraft', 'interceptor', 'rifle', 'sniper', 'ruinmaw', 'dreadthorn', 'bulwark', 'thornback', 'razorwing', 'ravager', 'skitterling', 'leaper'];
function aiSpotter(g, s) {
  const side = g.sides[s], dir = dirOf(s), opp = 1 - s;
  const sieging = side.stance === 'attack' && side.pushTo !== null && side.pushMode === 'siege';
  const mine = sieging ? g.ents.filter(e => e.kind === 'u' && e.side === s && e.hp > 0) : [];
  if (!sieging || !mine.some(u => AI_ART.includes(u.type))) { side.spotter = null; side.spotU = null; return; }
  let sp = mine.find(u => u.id === side.spotter);
  if (!sp) for (const t of SPOTTER_PREF) { sp = mine.find(u => u.type === t); if (sp) break; }
  if (!sp) { side.spotter = null; side.spotU = null; return; }
  // Nearest known edge of the enemy base, measured towards us (x = -dir * u grows towards our side)
  let front = -dir * hqU(opp) + 160;
  const gh = Object.values(g.fog[s].ghosts);
  if (gh.length) front = Math.max(...gh.map(b => -dir * b.u + b.half));
  side.spotter = sp.id;
  side.spotU = clamp(-dir * (front + SIGHT[sp.type] - 15), 0, L);
}

/* ---------- Match log (v2.9) ----------
   Written by the SIM for the post-match report and never read by it, so play is unchanged; the UI reads it only
   once the match is over. Bounded: at most LOG_CAP events, an army and bank sample every 15 s, losses per 10 s.

  const L = g.log, M = logMoments(g), top = Math.max(1, ...L.army[0], ...L.army[1]), n = Math.max(L.army[0].length, 2);
  const pl = a => a.map((v, i) => `${(i / (n - 1) * 300).toFixed(1)},${(44 - v / top * 40).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 300 46" preserveAspectRatio="none"><polyline fill="none" stroke="#39c8ff" stroke-width="1.6" points="${pl(L.army[0])}"/><polyline fill="none" stroke="#ff4d4d" stroke-width="1.6" points="${pl(L.army[1])}"/></svg>
    <p class="note" style="margin-top:0">Army value every 15 s${L.from > 0 ? ` from ${mmss(L.from)}` : ''} (you blue, enemy red; peak ${fmtN(top)})</p>
    <ul class="tl">${M.map(m => `<li><b>${mmss(m.t)}</b><span>${m.txt}</span>${m.tag ? `<span class="tag">${m.tag}</span>` : ''}</li>`).join('') || '<li>No major moments were recorded.</li>'}</ul>${repFrom(L)}`;
}
function repLessons(g) {
  return logLessons(g).map(l => `<div class="les"><div><em class="f">Fact</em>${l.fact}</div><div><em class="i">Interpretation</em>${l.why}</div>${l.next ? `<div><em class="r">Next time</em>${l.next}</div>` : ''}</div>`).join('') +
    `<p class="note">Lessons come only from events the game recorded. Where it can't tell why a fight was won or lost, it says so.</p>${repFrom(g.log)}`;
}
function repText(g) {
  const R = g.result || {}, win = g.winner === 0;
  const res = R.how === 'draw' ? 'Draw (mutual extinction)' : `${win ? 'Victory' : 'Defeat'}, ${R.how === 'score' ? `decided by ${R.by || 'score'} (${R.reason === 'limit' ? 'storm peak' : 'both HQs fell'})` : R.how === 'storm' ? `${win ? 'enemy' : 'your'} HQ fell to the Extinction Event` : `${win ? 'enemy' : 'your'} HQ destroyed`}`;
  return logText(g, { version: VERSION, diff: (DIFF[g.diffKey] || DIFF.normal).label, persona: PERSONA_NAME[(g.sides[1].persona || {}).kind] || 'unknown', result: res });
}
function repCopy() {
  const text = repText(game), done = () => { const m = $('copyMsg'); if (m) { m.textContent = 'Copied'; m.className = 'ok'; } };
  const fallback = () => { // clipboard blocked (some iPhone Safari cases): show the text selected, ready for the Copy menu
    const box = document.createElement('div'); box.className = 'cpy';
    box.innerHTML = '<p><b>Copy match log</b>: this browser blocked the clipboard. The text is selected: tap <b>Copy</b>, or press and hold to select it.</p><textarea readonly></textarea><button class="ghost">Close</button>';
    const ta = box.querySelector('textarea'); ta.value = text;
    box.querySelector('button').addEventListener('click', () => box.remove());
    $('box').appendChild(box); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    try { if (document.execCommand('copy')) done(); } catch (e) {}
  };
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, fallback); return; } } catch (e) {}
  fallback();
}

/* ---------- Sound (Web Audio, generated in code; no files) ----------
   One AudioContext, a master gain and a compressor so big fights don't clip. Each sound is 2–5 short-lived nodes
   that are disconnected when they end; nothing loops, so nothing can get stuck. At most 14 sounds play at once:
   small arms may use 9 of them, cannons and blasts 12, game events all 14. Each sound also has its own cap and a
   minimum gap. Battle sounds are panned by screen position, fade at the screen edge and are silent off screen; they
   come only from the effects code, which already skips anything hidden in the fog. iOS: audio starts on the first
   tap, is suspended in the background and resumed on return (or on the next tap). */
const SOUND_KEY = 'extinctionEvent.sound';
const SND = { ctx: null, master: null, noise: null, bufs: {}, live_v: [], on: true, voices: 0, live: 0, per: {}, last: {}, rnd: mulberry(77), played: 0, dropped: 0 };
try { SND.on = localStorage.getItem(SOUND_KEY) !== 'off'; } catch (e) {}
const SND_MAX = 14, SND_ROOM = [[3, 8, 14], [6, 10, 14], [9, 12, 14]]; // room per priority, by effect quality level (low, medium, full)

function sndInit() {
  if (SND.ctx || !SND.on) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    const ctx = new AC(), comp = ctx.createDynamicsCompressor(), master = ctx.createGain();
    comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
    master.gain.value = 0.7; master.connect(comp); comp.connect(ctx.destination);
    const nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = SND.rnd() * 2 - 1;
    const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050); s.connect(ctx.destination); s.start(0); // iOS unlock
    SND.ctx = ctx; SND.master = master; SND.noise = nb;
    sndBake();
  } catch (e) { SND.ctx = null; } // no audio: the game plays on silently
}
// Every sound is rendered once into a buffer (off the main audio graph), so playing one costs three nodes:
// a buffer source, a gain and a pan. Until a buffer is ready, that sound is synthesised live.
async function sndBake() {
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext, sr = SND.ctx.sampleRate;
  if (!OAC) return;
  const jobs = [];
  for (const name of Object.keys(SFX)) if (name === 'boom') for (const sz of [12, 30, 50]) jobs.push([`boom:${sz}`, name, sz]); else jobs.push([name, name, 0]);
  for (const [key, name, size] of jobs) {
    try {
      const oc = new OAC(1, Math.ceil(sr * 1.6), sr), v = voice(oc, 0, 1, 0, oc.destination);
      SFX[name][4](v, size);
      const buf = await oc.startRendering(), d = buf.getChannelData(0);
      let n = d.length; while (n > 1 && Math.abs(d[n - 1]) < 1e-4) n--;
      const out = SND.ctx.createBuffer(1, n, sr); out.copyToChannel(d.subarray(0, n), 0);
      SND.bufs[key] = out;
    } catch (e) { return; } // keep synthesising live
  }
}
function sndWake() { sndInit(); if (SND.ctx && SND.ctx.state !== 'running' && !document.hidden) SND.ctx.resume().catch(() => {}); }
for (const t of ['pointerdown', 'touchend', 'keydown']) document.addEventListener(t, sndWake, { capture: true, passive: true });
document.addEventListener('visibilitychange', () => {
  if (!SND.ctx) return;
  if (document.hidden) SND.ctx.suspend().catch(() => {}); else SND.ctx.resume().catch(() => {});
});
// Backstop: one sweep a second disconnects any voice whose 'ended' event never came (no timer per sound)
setInterval(() => {
  if (!SND.ctx || !SND.live_v.length) return;
  const now = SND.ctx.currentTime;
  SND.live_v = SND.live_v.filter(v => { if (now > v.end + 1.5) { v.done(); return false; } return !v.ended; });
}, 1000);
function sndSet(on) {
  SND.on = on;
  try { localStorage.setItem(SOUND_KEY, on ? 'on' : 'off'); } catch (e) {}
  if (on) sndWake();
  if (SND.master) SND.master.gain.value = on ? 0.7 : 0;
}
const sndLabel = () => `Sound: ${SND.on ? 'On' : 'Off'}`;

// A voice: a gain (and a stereo pan where supported) into the master; sources are added by the recipe
function voice(ctx, t, vol, pan, dest = SND.master) {
  const v = { ctx, t, nodes: [], end: t, last: null, out: ctx.createGain() };
  v.out.gain.value = vol;
  let tail = v.out;
  if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; v.out.connect(p); tail = p; v.nodes.push(p); }
  tail.connect(dest); v.nodes.push(v.out);
  return v;
}
function env(v, g, at, dur, peak) {
  g.gain.setValueAtTime(0.0001, at); g.gain.linearRampToValueAtTime(peak, at + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
}
function tone(v, type, f0, f1, dur, peak, delay = 0) {
  const { ctx } = v, at = v.t + delay, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, at); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, at + dur);
  env(v, g, at, dur, peak); o.connect(g); g.connect(v.out); o.start(at); o.stop(at + dur + 0.02);
  v.nodes.push(o, g); if (at + dur + 0.02 >= v.end) { v.end = at + dur + 0.02; v.last = o; } return o;
}
function hiss(v, filter, f0, f1, q, dur, peak, delay = 0) {
  const { ctx } = v, at = v.t + delay, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = SND.noise; f.type = filter; f.Q.value = q;
  f.frequency.setValueAtTime(f0, at); if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, at + dur);
  env(v, g, at, dur, peak); s.connect(f); f.connect(g); g.connect(v.out);
  s.start(at, SND.rnd() * 0.5); s.stop(at + dur + 0.02);
  v.nodes.push(s, f, g); if (at + dur + 0.02 >= v.end) { v.end = at + dur + 0.02; v.last = s; } return s;
}
// name: [priority 0 small arms / 1 heavy / 2 events, per-sound cap, min gap s, global (plays without a position), recipe]
const SFX = {
  rifle:    [0, 2, 0.07, 0, v => hiss(v, 'bandpass', 2400, 1600, 1.2, 0.05, 0.5)],
  gatling:  [0, 2, 0.12, 0, v => { hiss(v, 'bandpass', 1800, 1300, 1.4, 0.045, 0.5); hiss(v, 'bandpass', 1800, 1300, 1.4, 0.045, 0.45, 0.08); }],
  hydra:    [0, 2, 0.12, 0, v => { hiss(v, 'bandpass', 2200, 1500, 1.4, 0.04, 0.45); hiss(v, 'bandpass', 2200, 1500, 1.4, 0.04, 0.4, 0.07); }],
  flame:    [0, 2, 0.24, 0, v => { hiss(v, 'lowpass', 1400, 500, 0.9, 0.26, 0.55); }],
  bomb:     [0, 2, 0.6, 0, v => { tone(v, 'sine', 1300, 380, 0.7, 0.22); }], // a falling whistle (v2.15)
  flak:     [0, 2, 0.1, 0, v => { tone(v, 'triangle', 520, 300, 0.05, 0.35); tone(v, 'triangle', 520, 300, 0.05, 0.3, 0.06); }],
  rail:     [1, 2, 0.1, 0, v => { hiss(v, 'highpass', 3000, 3000, 0.7, 0.06, 0.5); tone(v, 'sine', 1500, 350, 0.18, 0.25); }],
  rocket:   [1, 2, 0.08, 0, v => hiss(v, 'bandpass', 600, 2400, 1.5, 0.3, 0.45)],
  missile:  [0, 2, 0.1, 0, v => hiss(v, 'bandpass', 900, 2600, 1.5, 0.14, 0.4)],
  cannon:   [1, 2, 0.08, 0, v => { tone(v, 'sine', 110, 45, 0.3, 0.9); hiss(v, 'lowpass', 900, 300, 0.7, 0.18, 0.5); }],
  siege:    [1, 1, 0.15, 0, v => { tone(v, 'sine', 90, 35, 0.35, 0.9); tone(v, 'sine', 90, 35, 0.35, 0.8, 0.07); hiss(v, 'lowpass', 700, 200, 0.7, 0.25, 0.5); tone(v, 'square', 140, 120, 0.08, 0.06); }],
  shell:    [1, 2, 0.15, 0, v => { tone(v, 'sine', 70, 35, 0.35, 0.9); hiss(v, 'lowpass', 500, 200, 0.7, 0.25, 0.5); }],
  whistle:  [0, 1, 0.3, 0, v => tone(v, 'sine', 1500, 600, 0.7, 0.12)],
  warp:     [1, 2, 0.3, 0, v => { tone(v, 'sine', 300, 1200, 0.9, 0.12); tone(v, 'triangle', 600, 2400, 0.8, 0.05, 0.15); }], // a rising shimmer (v2.26)
  boom:     [1, 2, 0.06, 0, (v, s) => { const d = 0.25 + s / 80; hiss(v, 'lowpass', 400 + s * 20, 120, 0.7, d, 0.7); if (s > 28) tone(v, 'sine', 60, 30, d, 0.8); }],
  step:     [0, 1, 0.25, 0, v => { tone(v, 'sine', 55, 35, 0.16, 0.7); hiss(v, 'lowpass', 220, 150, 0.7, 0.1, 0.3); }],
  collapse: [2, 1, 0.3, 0, v => { hiss(v, 'lowpass', 320, 90, 0.7, 1.2, 0.8); tone(v, 'sine', 45, 25, 1, 0.8); }],
  hqgun:    [1, 1, 0.2, 0, v => { const o = tone(v, 'sawtooth', 220, 60, 0.28, 0.25); tone(v, 'sine', 90, 40, 0.2, 0.6); return o; }],
  built:    [2, 1, 0.3, 1, v => { tone(v, 'triangle', 660, 660, 0.12, 0.5); tone(v, 'triangle', 990, 990, 0.16, 0.5, 0.1); }],
  upgrade:  [2, 1, 0.3, 1, v => { [523, 659, 784].forEach((f, i) => tone(v, 'triangle', f, f, 0.14, 0.45, i * 0.09)); }],
  trained:  [2, 1, 0.25, 1, v => tone(v, 'sine', 880, 880, 0.07, 0.3)],
  node:     [2, 1, 0.5, 1, v => { tone(v, 'triangle', 523, 523, 0.45, 0.35); tone(v, 'triangle', 784, 784, 0.45, 0.3, 0.05); }],
  alarm:    [2, 1, 1, 1, v => { [700, 520, 700, 520].forEach((f, i) => tone(v, 'triangle', f, f, 0.13, 0.4, i * 0.15)); }],
  ping:     [2, 1, 1, 1, v => { tone(v, 'sine', 1200, 1200, 0.35, 0.3); tone(v, 'sine', 1200, 1200, 0.25, 0.12, 0.18); }],
  victory:  [2, 1, 2, 1, v => { [523, 659, 784, 1047].forEach((f, i) => tone(v, 'triangle', f, f, i === 3 ? 0.6 : 0.16, 0.5, i * 0.14)); }],
  shieldUp: [1, 1, 0.5, 0, v => { tone(v, 'sine', 300, 900, 0.35, 0.3); tone(v, 'triangle', 600, 1200, 0.3, 0.12, 0.05); }],
  pulse:    [1, 1, 0.5, 0, v => { [392, 523, 659].forEach((f, i) => tone(v, 'sine', f, f * 1.01, 0.6, 0.22, i * 0.06)); }],
  uplink:   [2, 1, 1, 1, v => { tone(v, 'square', 220, 880, 0.5, 0.08); tone(v, 'sine', 440, 1760, 0.5, 0.15, 0.05); }],
  siren:    [2, 1, 1.5, 1, v => { tone(v, 'sawtooth', 600, 900, 0.35, 0.12); tone(v, 'sawtooth', 900, 600, 0.35, 0.12, 0.35); tone(v, 'sawtooth', 600, 900, 0.35, 0.12, 0.7); }],
  orbital:  [2, 2, 0.3, 0, v => { hiss(v, 'highpass', 2500, 800, 0.7, 0.12, 0.6); tone(v, 'sine', 80, 26, 1.1, 1); hiss(v, 'lowpass', 900, 80, 0.7, 1.3, 0.9); }],
  rumble:   [2, 1, 3, 1, v => { hiss(v, 'lowpass', 160, 60, 0.7, 1.5, 0.9); tone(v, 'sine', 42, 30, 1.5, 0.7); }],
  meteor:   [1, 1, 0.7, 0, v => { hiss(v, 'bandpass', 2400, 500, 1.2, 0.35, 0.35); tone(v, 'sine', 70, 35, 0.35, 0.6, 0.3); }],
  defeat:   [2, 1, 2, 1, v => { [440, 349, 294, 220].forEach((f, i) => tone(v, 'triangle', f, f, i === 3 ? 0.7 : 0.22, 0.45, i * 0.2)); }],
};
const SND_VOL = { 0: 0.22, 1: 0.32, 2: 0.4 };
function sndPlay(name, x, size) {
  const r = SFX[name], ctx = SND.ctx;
  if (!r || !SND.on || !ctx || ctx.state !== 'running') return false;
  const [pri, cap, gap, global, fn] = r, now = ctx.currentTime;
  let vol = SND_VOL[pri], pan = 0;
  if (!global) { // position: pan across the screen, fade at the edges, silent off screen
    const off = (x - cam.x) / (V.cw / 2 / V.S || 1);
    if (Math.abs(off) > 1.15) return false;
    vol *= 1 - 0.6 * clamp((Math.abs(off) - 0.8) / 0.35, 0, 1); pan = clamp(off * 0.6, -0.8, 0.8);
  }
  if (now - (SND.last[name] ?? -9) < gap || (SND.per[name] || 0) >= cap || SND.voices >= SND_ROOM[VFX.q][pri]) { SND.dropped++; return false; }
  SND.last[name] = now; SND.per[name] = (SND.per[name] || 0) + 1; SND.voices++; SND.played++;
  const v = voice(ctx, now + 0.005, vol, pan), buf = SND.bufs[name === 'boom' ? `boom:${size < 20 ? 12 : size < 40 ? 30 : 50}` : name];
  if (buf) { // the usual path: play the baked buffer, a little detuned so repeats don't sound identical
    const src = ctx.createBufferSource(), rate = pri === 0 ? 0.94 + SND.rnd() * 0.12 : 0.97 + SND.rnd() * 0.06;
    src.buffer = buf; src.playbackRate.value = rate; src.connect(v.out); src.start(v.t);
    v.nodes.push(src); v.last = src; v.end = v.t + buf.duration / rate;
  } else fn(v, size || 0);
  SND.live += v.nodes.length;
  const done = () => { // every node of the voice is disconnected when it ends
    if (v.ended) return; v.ended = true;
    for (const n of v.nodes) { try { n.disconnect(); } catch (e) {} }
    SND.live -= v.nodes.length; SND.voices--; SND.per[name]--;
  };
  if (v.last) v.last.onended = done; else done();
  v.done = done; SND.live_v.push(v); // swept below in case 'ended' never arrives
  return true;
}

/* ---------- Main loop ---------- */
let uiT = 0, saveT = 5;
function frame(ts) {
  requestAnimationFrame(frame);
  vfxQuality(ts - last, !!(game && running && !paused));
  const dt = Math.min(0.05, Math.max(0, (ts - last) / 1000)); last = ts;
  if (game && running && !paused) {
    let rem = dt * (game.countdown > 0 ? 1 : speed); // the countdown always takes real seconds
    while (rem > 1e-6) { const st = Math.min(rem, 1 / 30); update(game, st); rem -= st; }
    updateIntro();
    handleEvents();
    if (game.over && !endTimer) { clearSave(); endTimer = setTimeout(() => { endTimer = null; if (game && game.over) { running = false; showEnd(); } }, 1900); }
    saveT -= dt;
    if (saveT <= 0 && !game.over) { saveT = 5; saveGame(); }
    uiT -= dt;
    if (uiT <= 0) { uiT = 0.15; refreshUI(false); }
  } else if (game && game.over) update(game, dt);
  if (!gest && Math.abs(cam.vx) > 5) { cam.x += cam.vx * dt; cam.vx *= Math.pow(0.03, dt); clampCam(); }
  render(ctx, game, ts / 1000, sel, selPad);
  drawMinimapNow();
}
buildAbil();
resize();
homeCamera();
showStart();
// Title screen covers the main menu on load; a tap (click, so no ghost tap reaches the menu) fades it away
$('title').addEventListener('click', () => { const t = $('title'); t.classList.add('out'); setTimeout(() => t.remove(), 400); });
requestAnimationFrame(frame);
</script>
